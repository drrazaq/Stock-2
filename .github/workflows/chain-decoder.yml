name: Chain decoder
# The CHAIN DECODER on its own (chain-decoder.mjs; pre-registered 23 Oct 2026 as CHAIN-MOM1 / CHAIN-DEMAND1 / CHAIN-LAG1 / CHAIN-READ1),
# so it can run now without re-running every Sunday study. The same step also runs every Sunday inside leaders-study.yml. The
# whole-market price cache is RESTORED READ ONLY from the Sunday job (never saved here); only this lab's own EDGAR cache (chain-cache)
# is saved, so a run that runs out of time resumes. Commits only its own output files and its own library entries.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: chain-decoder
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: chain-cache
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-
      - shell: bash
        timeout-minutes: 85
        run: |
          set -o pipefail
          node chain-decoder.mjs 2>&1 | tee run.log
        env:
          CHAIN_MINUTES: '75'
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: chain-cache
          key: chain-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -c 20000 run.log > data/chain-decoder-run.log 2>/dev/null || true
          FILES="data/chain-decoder.json data/chain-graph.json data/chain-today.json data/chain-decoder-error.json data/chain-decoder-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "chain decoder $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the chain decoder result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: chain-decoder-log
          path: run.log
