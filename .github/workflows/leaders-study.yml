name: Leaders fair test
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-studies-now.txt']   # Claude's 'run now' button: changing this file starts the Sunday studies at once
permissions:
  contents: write
concurrency: leaders-study
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      MASSIVE_PAID: '1'
    steps:
      # Always start from the newest saved state.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The library as it was when this run started: at the end only the entries THIS run changed are re-applied on top of the newest library.
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      # Two years of whole-market prices are kept in the Actions cache, not in the repository.
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-${{ github.run_id }}
          restore-keys: leaders-study-
      - shell: bash
        run: |
          set -o pipefail
          node leaders-study.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Share counts on today's split basis, before quality and autolab use them (uses data/splits.json from the step above).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node shares.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # Value chains (AI, space, energy, obesity drugs) and every industry: how each link is doing (same prices, no extra calls).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node chains.mjs 2>&1 | tee -a run.log
      # Chain ripple: when a chain member jumps, do its suppliers/peers that have not moved yet follow? (same prices, no extra calls)
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node chain-ripple.mjs 2>&1 | tee -a run.log
      # Insider cluster buying (SEC Form 4 data sets, free, quarterly): do 2-3+ insiders buying with their own money predict gains?
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node insider-study.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # Learn from the winners, on the same whole-market prices (no extra data calls).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          node winners-study.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Test new hunting rules on the same prices (no extra data calls).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          node hunting-lab.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Score every stock and test whether the score works (same prices, no extra data calls).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          node score-study.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Earnings-surprise drift fair test (same prices, no extra data calls).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          MODE=study node earnings-study.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Company-news event study + supply-chain test (same prices; the event history comes from the weekday smart-money job).
      - uses: actions/cache/restore@v4
        if: success() || failure()   # run even if an earlier study step failed
        with:
          path: ev-cache
          key: events-cache-none
          restore-keys: events-cache-
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          MODE=study node events-study.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # HORIZONS: pullback / leader / turn-around setups held 1, 3 and 6 months (mid and long term), same prices.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node horizons.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # EXIT TEST: the same buys sold 10 ways (hold, trailing stops, profit lock, average lines, target/stop), vs the S&P 500.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node exits.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # SELL NOW, BUY BACK LOWER? Selling and re-buying vs simply holding, 5 years, costs included.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node rebuy.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # REBALANCING: 10-stock portfolios, equal weights / trim over 15% / new cash to the smallest, vs simply holding.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node rebalance.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # QUALITY COMPANIES: long investing by the SEC reports (profit, no dilution, lean growth, cash-backed profit), held 6-12 months.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node quality.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # STOP STUDY: 10 stop rules on your own kind of buys (any / strong stocks), vs no stop, 5 years.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node stops.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # AUTOLAB: the system invents 60 new rules a week and tests each through discovery, validation and an untouched vault; survivors go to paper.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node autolab.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # OCTOPUS: 26 angles + every pair of them, retrained every week, judged only on unseen weeks (same prices + SEC events).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node octopus.mjs 2>&1 | tee -a run.log
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Economic calendar study: S&P 500 on CPI / PPI / retail sales / jobs / Fed days, by surprise vs forecast (encrypted data).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          MODE=study node calendar.mjs 2>&1 | tee -a run.log
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      # SEC share counts per quarter since 2019 (dilution flag; float known on each past day for the fast-mover lab).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node shares.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # Fast-mover lab: its own 5-year whole-market cache incl. 1-3 USD stocks (paid Massive plan), decode + day-trade tests.
      - uses: actions/cache/restore@v4
        if: success() || failure()   # run even if an earlier study step failed
        with:
          path: fm-cache
          key: fm-cache-${{ github.run_id }}
          restore-keys: fm-cache-
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        run: |
          set -o pipefail
          MODE=study node fastmover-lab.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # Agent A (Timing), research only, same fm-cache (minute bars cached in it): A-MISS1 missed-runner autopsy and A-ORB1 opening-range
      # breakout on stocks in play (pre-registered from the original paper; incremental until the 2-year minute history is complete).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node missed-runners.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          MR_CALLS: '300'
          MR_MINUTES: '12'
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node orb-study.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ORB_CALLS: '2500'
          ORB_MINUTES: '35'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: fm-cache
          key: fm-cache-${{ github.run_id }}
      # SEQUENCE STUDY: filing -> quiet days -> breakout as ONE rule, vs the same breakout without a filing. Full daily history per
      # company (no minimum volume, so quiet days are not missing), kept in its own Actions cache.
      - uses: actions/cache/restore@v4
        if: success() || failure()   # run even if an earlier study step failed
        with:
          path: seq-cache
          key: seq-cache-${{ github.run_id }}
          restore-keys: seq-cache-
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node sequence-study.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      # Agent A (Timing) studies, research only: A-EW1 early-wave stack (pre-registered, run once; needs ev-cache from above) and the A-RG1 regime gate.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node ew-stack.mjs 2>&1 | tee -a run.log
      # One step per study, so one crash no longer hides the others.
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node regime-gate.mjs 2>&1 | tee -a run.log
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node pattern-lab.mjs 2>&1 | tee -a run.log
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node swing-lab.mjs 2>&1 | tee -a run.log
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node fulfilling.mjs 2>&1 | tee -a run.log
      # Agent A, research only: E16 earnings gap-and-hold absorption (pre-registered, run once per version; earnings dates from
      # data/earnings-cache.json.gz, same prices). Writes data/e16-absorption.json and library E16.
      - if: success() || failure()   # run even if an earlier study step failed
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          node e16-absorption.mjs 2>&1 | tee -a run.log
      # Agent C (Crowd), research only: tip-source scoreboard (every logged source vs the average stock and the S&P 500; FADE list for
      # C-FADE1) and C-GOV1 federal awards (official USAspending API, pre-registered, run once; awards kept in study-cache/gov).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node tip-score.mjs 2>&1 | tee -a run.log
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node gov-awards.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # Agent C, pre-registered 22 Oct 2026, run once: C-GOV1b federal awards with the USAspending parent map (awards and parent
      # lookups kept in study-cache/gov2; resumable, 60-minute budget) and C-S8 / C-LOCK share-supply avoid blocks (EDGAR full index,
      # kept in study-cache/edgar-idx).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -o pipefail
          node gov-awards2.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          node share-supply.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # CATALYST RUN-UP (owner's OCGN case, pre-registered 23 Oct 2026 as CAT-RUN1 / CAT-NEWS1, run once as written): 8-K catalyst dates
      # (EDGAR full-text search + documents), dilution filings (EDGAR full index), same prices; also writes the weekly upcoming-catalyst
      # list read by ACTIONS (only if a rule reached tier 2 or proven). Its EDGAR downloads are kept in their own Actions cache.
      - uses: actions/cache/restore@v4
        if: success() || failure()   # run even if an earlier study step failed
        with:
          path: cat-cache
          key: cat-cache-${{ github.run_id }}
          restore-keys: cat-cache-
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -o pipefail
          node catalyst-lab.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: cat-cache
          key: cat-cache-${{ github.run_id }}
      # CHAIN DECODER (owner, 23 Oct 2026: "follow the source"; pre-registered as CHAIN-MOM1 / CHAIN-DEMAND1 / CHAIN-LAG1 / CHAIN-READ1, run
      # once as written): point-in-time chain graph from EDGAR (membership filings, major customers, material agreements), same prices;
      # writes the weekly hot-layer list read by ACTIONS and  chains  (buys only if a rule reached tier 2 or proven). Own Actions cache.
      - uses: actions/cache/restore@v4
        if: success() || failure()   # run even if an earlier study step failed
        with:
          path: chain-cache
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -o pipefail
          node chain-decoder.mjs 2>&1 | tee -a run.log
        env:
          CHAIN_MINUTES: '60'
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: chain-cache
          key: chain-cache-${{ github.run_id }}
      # DISCOVERY ENGINE v2 (owner, 23 Oct 2026: "come up with new paths by itself"): learns what preceded the big moves (runners vs matched
      # look-alikes) on 2021-2023 only, freezes the best feature combinations as rules, tests each ONCE on 2024-2026 at the tier-2 standard
      # with a luck bar that rises with every rule tested; each week adds the next 10 untested rules of the frozen pool. Same prices and the
      # caches restored above (ev-cache, cat-cache, study-cache); writes data/discovery2.json and data/discovery2-today.json (ACTIONS).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -o pipefail
          node discovery2.mjs 2>&1 | tee -a run.log
      # AGENT LEAGUE referee: freezes each research agent's champion picks weekly and scores old batches vs the S&P 500 (same prices).
      - shell: bash
        if: success() || failure()   # run even if an earlier study step failed
        continue-on-error: true
        run: |
          set -o pipefail
          node league.mjs 2>&1 | tee -a run.log
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: seq-cache
          key: seq-cache-${{ github.run_id }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: study-cache
          key: leaders-study-${{ github.run_id }}
      # SAVE (runs even if a study failed). Fresh main first, then only this run's own output files (listed below) are copied back,
      # and data/strategy-library.json gets only the entries/fields this run changed (library-merge.mjs), so library edits pushed
      # during the 2-hour run are kept. The push loop keeps the old behaviour (pull --rebase -X theirs, 5 tries).
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES="data/leaders-study.json data/winners-study.json data/winners-paper.json data/hunting-lab.json data/hunting-paper.json data/score-study.json data/score-paper.json data/earnings-study.json data/events-study.json data/octopus.json data/horizons.json data/octopus-paper.json data/octopus-model.json data/fastmover-lab.json data/calendar.enc data/calendar-status.json data/shares.json.gz data/exits.json data/rebuy.json data/rebalance.json data/quality.json data/stops.json data/autolab.json data/splits.json data/chain-ripple.json data/insider-study.json data/sequence-study.json data/chains-status.json data/agent-league.json data/agent-shelf.jsonl data/ew-stack.json data/regime-gate.json data/pattern-lab.json data/swing-lab.json data/fulfilling.json data/tip-score.json data/gov-awards.json data/gov-awards2.json data/share-supply.json data/missed-runners.json data/orb-study.json data/ignition-missed-history.jsonl data/e16-absorption.json data/catalyst-lab.json data/catalyst-today.json data/chain-decoder.json data/chain-graph.json data/chain-today.json data/chain-decoder-error.json data/discovery2.json data/discovery2-today.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && ! git diff --quiet HEAD -- "$f" 2>/dev/null && mkdir -p "$OUTD/$(dirname "$f")" && cp "$f" "$OUTD/$f"; done; true
          for f in $FILES; do [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1 && mkdir -p "$OUTD/$(dirname "$f")" && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json 2>&1 | tee -a run.log || echo "Error: library merge failed; this run's library edits were not saved" | tee -a run.log
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "leaders fair test $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the study result" | tee -a run.log; exit 1; }
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
