name: Squad 10 lab
# SQUAD 10: "A HALAL CORE BASKET THAT BEATS SPUS" (squad10-lab.mjs; the owner's squad competition, 24 Oct 2026). Shariah-screened baskets of
# the largest US companies (top 10 / 20 / 30 / 50, cap-weighted or capped at 15%, quarterly or yearly, two 12-1 momentum variants),
# pre-registered in squad10-core.mjs and data/strategy-library.json before any run; each one's 5-year test runs ONCE (first complete verdict
# frozen in data/squad10-lab.json firstRun), judged as a portfolio vs SPUS (primary) and SPY, and per holding period. Forward PAPER ledger
# from Monday 26 Oct 2026 (data/squad10-paper.jsonl, squad10-today.json = the current members with weights, squad10-board.json).
# The whole-market price cache, Squad 4's and Squad 5's caches are RESTORED READ ONLY (never saved); only squad10-cache is saved.
# Commits only its own output files and its own library entries. Never places an order. Start by hand: change run-squad10-now.txt
# (a last line containing DIAG = coverage check only, nothing judged or written) or run the workflow.
on:
  schedule:
    - cron: '17 16 * * 0'     # Sunday, after the Sunday studies
    - cron: '25 0 * * 2-6'     # weekday evenings after the close: current members + paper lane
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad10-now.txt']
permissions:
  contents: write
concurrency: squad10-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad5-cache
          key: squad5-cache-none
          restore-keys: squad5-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad10-cache
          key: squad10-cache-${{ github.run_id }}
          restore-keys: squad10-cache-
      - shell: bash
        timeout-minutes: 130
        run: |
          set -o pipefail
          if tail -n 1 run-squad10-now.txt | grep -q DIAG; then export DIAG=1; fi
          node squad10-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ10_MINUTES: '120'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad10-cache
          key: squad10-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad10-run.log 2>/dev/null || true
          FILES="data/squad10-lab.json data/squad10-paper.jsonl data/squad10-today.json data/squad10-board.json data/squad10-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 10 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 10 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad10-lab-log
          path: run.log
