name: News watch
on:
  schedule:
    # every 15 minutes, about 7:00 to 16:45 New York in summer (6:00 to 15:45 in winter), Monday to Friday
    - cron: '*/15 11-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node news-watch.mjs 2>&1 | tee run.log
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          for f in data/news-seen.json data/news-meta.json data/news-log.jsonl data/macro-state.json data/macro-log.jsonl; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "news $(date -u +%FT%RZ)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|cannot|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
