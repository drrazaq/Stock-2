name: News watch
on:
  schedule:
    # every 15 minutes, about 7:00 to 16:45 New York in summer (6:00 to 15:45 in winter), Monday to Friday
    - cron: '*/15 11-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  # schedule guard (17 Nov 2026): GitHub's cron here runs hours late. While the bot job's schedule guard is alive it starts this job
  # on time itself, so a cron-started copy is skipped (no late duplicate messages or after-close scans). Fails open.
  slot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            schedule-skip.mjs
            data/schedule-guard.json
          sparse-checkout-cone-mode: false
      - id: g
        run: node schedule-skip.mjs | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  news:
    needs: slot
    if: ${{ !cancelled() && needs.slot.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node news-watch.mjs 2>&1 | tee run.log
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          for f in data/news-seen.json data/news-meta.json data/news-log.jsonl data/macro-state.json data/macro-log.jsonl; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "news $(date -u +%FT%RZ)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|cannot|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
