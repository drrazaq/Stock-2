name: Follow lane
# Public traders scored on their own full dated call history (follow-lane.mjs). Daily after the US close: new uploads / posts of FOLLOW and
# WATCH traders, rescore, write data/follow-board.json and data/follow-today.json (read by the ACTIONS message). Sunday: full refresh
# (discover new YouTube channels, backfill up to 2 years of uploads within the ~8,000-unit daily YouTube quota, refresh every channel).
# Other sources each run: StockTwits, US Congress trades (Alpha Vantage, members rotated within the free-tier limit), SEC 13F of
# concentrated funds (weekly), newsletter RSS feeds (data/follow-feeds.json).
on:
  schedule:
    - cron: '5 21 * * 1-5'    # 17:05 New York in summer time (16:05 in winter): after the close, before the nightly ACTIONS scan (21:30 UTC)
    - cron: '0 14 * * 0'      # Sunday full refresh, after the Sunday study has refreshed the price cache
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (discover + backfill) or daily'
        default: 'full'
permissions:
  contents: write
concurrency: follow-lane
jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require follow-calls.jsonl follow-board.json
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The whole-market price cache of the Sunday study (2 years, dead stocks kept, splits repaired), read only.
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      # This lane's own recent days (and a full 2-year cache if the study cache is missing).
      - uses: actions/cache/restore@v4
        with:
          path: follow-cache
          key: follow-cache-${{ github.run_id }}
          restore-keys: follow-cache-
      - shell: bash
        run: |
          set -o pipefail
          node follow-lane.mjs 2>&1 | tee run.log
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 14 * * 0' && 'full' || 'daily') }}
          YT_KEY: ${{ secrets.YT_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: follow-cache
          key: follow-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "follow lane (owner marks and the full TRY SMALL state)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "follow lane (owner marks and the full TRY SMALL state)" follow-board.json follow-today.json follow-calls.jsonl follow-channels.json follow-fade.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES=""
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "follow lane $(date -u +%FT%H:%MZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the follow lane result" | tee -a run.log; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "follow lane (owner marks and the full TRY SMALL state)" follow-board.json follow-today.json follow-calls.jsonl follow-channels.json follow-fade.json
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
