name: Account replay
# ACCOUNT REPLAY (account-replay-lab.mjs; 27 Oct 2026): the live TRY SMALL lane replayed as ONE real 2-slot account (2,000 USD, 1,000 USD a
# buy, max 2 open, scan.mjs priority order, 10-result switch-off, duplicate skip) versus SPY / SPUS with the same 2,000 USD; plus B-FCF1
# bought up to 5 sessions late. Policy pre-registered in account-replay-core.mjs before any result; run ONCE by hand (workflow_dispatch).
# The price cache is RESTORED READ ONLY. Commits only data/account-replay.json and data/account-replay-trades.jsonl. Never places an order.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'empty = the first replay; pb12t20 = the PB12 +20% target account'
        required: false
        default: ''
permissions:
  contents: write
concurrency: account-replay
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 75
        run: |
          set -o pipefail
          du -sh study-cache 2>/dev/null || true
          node --test test/account-replay-core.test.mjs
          node account-replay-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          MODE: ${{ github.event.inputs.mode }}
      - if: success()
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # P0: the replay results are restricted to the owner's ok marks: owner-derived outputs go ONLY to the private route; a failure fails the job visibly
          PF=0; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "account-replay" || PF=1   # explicit outcome: verified private save, or NOT DURABLE (never a silent green)
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          [ "$PF" = 0 ] || exit 1
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "account-replay" account-replay.json account-replay-trades.jsonl account-replay-pb12t20.json account-replay-pb12t20-trades.jsonl
