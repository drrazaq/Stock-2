name: Opportunity radar (after the close)
# The 11:15 New York radar is sent by the ignition watcher itself (it holds the live data). This job sends the after-the-close part:
# the day's radar lines scored at 15:00, the runners we missed and the radar's own scorecard (5-session scores from Alpaca daily bars).
# 20:40 UTC = 4:40 pm New York in summer, 3:40 pm in winter: after the watcher has saved the day (it stops at 15:00 New York).
on:
  schedule:
    - cron: '40 20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: opportunity-radar
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require radar-v3-ledger.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node shadow-outcomes.mjs 2>&1 | tee run.log || echo 'shadow outcomes failed' | tee -a run.log   # Phase 1 (28 Oct): 1/5/10-session outcomes + filter shadow report
          node opportunity-radar.mjs close 2>&1 | tee -a run.log
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "opportunity radar (owner marks)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "opportunity radar (owner marks)" radar-v3-ledger.jsonl shadow-report.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          true; [ -d data/shadow-outcomes ] && git add data/shadow-outcomes; true; true
          git diff --cached --quiet || git commit -m "radar v3 $(date -u +%FT%RZ)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "opportunity radar (owner marks)" radar-v3-ledger.jsonl shadow-report.json
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|cannot|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
