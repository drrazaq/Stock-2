name: Fast-mover minute test
on:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:
permissions:
  contents: write
concurrency: fastmover-intraday
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      MASSIVE_PAID: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require fastmover-paper.json
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The LEADERS cache is read only for its list of common stocks (funds and warrants are left out).
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: fm-cache
          key: fm-cache-${{ github.run_id }}
          restore-keys: fm-cache-
      # Minute-by-minute test of the ignition rules on every day a stock touched +10% (the sample grows each Saturday).
      - shell: bash
        run: |
          set -o pipefail
          MODE=intraday node fastmover-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: fm-cache
          key: fm-cache-${{ github.run_id }}
      - env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "fast movers (owner fail marks filter)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "fast movers (owner fail marks filter)" ignition-lab.json fastmover-lab.json fastmover-paper.json ignition-results.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          true   # P0: its outputs are private (saved above)
          git diff --cached --quiet || git commit -m "ignition test $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the test result" | tee -a run.log; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "fast movers (owner fail marks filter)" ignition-lab.json fastmover-lab.json fastmover-paper.json ignition-results.json
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
