name: Expert lab
# EXPERT LAB (expert-lab.mjs; owner's request of 23 Oct 2026: "TipRanks, Investing.com, Yahoo Finance and more have analyst profiles and
# portfolios showing their trades: find out how they won and make the system smarter"). Experts with PUBLIC, RANKED track records, ranked
# by US POINT IN TIME from official / licensed data only (FMP analyst grades, SEC 13F data sets, SEC Form 4 data sets, Alpha Vantage
# Congress trades). Pre-registered rules EXP-* (data/strategy-library.json), each run ONCE on the history the data allows (first verdict
# frozen in data/expert-lab.json), plus a forward PAPER record. Never places an order. Commits only its own files and its own library entries.
# Start by hand: change run-expert-now.txt (last line PROBE = endpoint check only) or run the workflow.
on:
  schedule:
    - cron: '50 22 * * 1-5'   # weekdays after the US close and the daily bars
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-expert-now.txt']
permissions:
  contents: write
concurrency: expert-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: expert-cache
          key: expert-cache-${{ github.run_id }}
          restore-keys: expert-cache-
      - shell: bash
        timeout-minutes: 160
        run: |
          set -o pipefail
          if tail -n 1 run-expert-now.txt 2>/dev/null | grep -q PROBE2; then export PROBE2=1; fi
          if tail -n 1 run-expert-now.txt 2>/dev/null | grep -q PROBE3; then export PROBE3=1; fi
          if tail -n 1 run-expert-now.txt 2>/dev/null | grep -q PROBE; then node expert-probe.mjs 2>&1 | tee run.log; exit 0; fi
          node expert-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TIPRANKS_KEY: ${{ secrets.TIPRANKS_KEY }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
          ETORO_KEY: ${{ secrets.ETORO_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: expert-cache
          key: expert-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/expert-run.log 2>/dev/null || true
          FILES="data/expert-lab.json data/expert-paper.jsonl data/expert-today.json data/expert-board.json data/expert-probe.json data/expert-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "expert lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the expert lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: expert-lab-log
          path: run.log
