name: Movers radar
on:
  schedule:
    - cron: '0 4 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency: movers
jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Always start from the newest saved state. Without this a run that was queued behind another one starts from an
      # older copy and then overwrites what the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node movers.mjs 2>&1 | tee run.log
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Fast movers: tomorrow's day-trade candidates on paper, and a DAY-TRADE LIST only for rules that passed the 5-year test.
      - uses: actions/cache/restore@v4
        with:
          path: fm-cache
          key: fm-cache-none
          restore-keys: fm-cache-
      - shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          MODE=live node fastmover-lab.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          MASSIVE_PAID: '1'
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # OCTOPUS daily: rank the whole market with the model trained on Sunday; top 5 logged as live paper picks.
      - shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          MODE=daily node octopus.mjs 2>&1 | tee -a run.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "movers $(date -u +%FT%RZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the data folder to the repository" | tee -a run.log; exit 1; }
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          printf '%s' "RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." | node tools/telegram-notify.mjs || echo 'Telegram failure notification unconfirmed; inspect job logs'
