name: Movers radar
on:
  schedule:
    - cron: '0 4 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency: movers
jobs:
  movers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Always start from the newest saved state. Without this a run that was queued behind another one starts from an
      # older copy and then overwrites what the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require fastmover-paper.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node movers.mjs 2>&1 | tee run.log
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Fast movers: tomorrow's day-trade candidates on paper, and a DAY-TRADE LIST only for rules that passed the 5-year test.
      - uses: actions/cache/restore@v4
        with:
          path: fm-cache
          key: fm-cache-none
          restore-keys: fm-cache-
      - shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          MODE=live node fastmover-lab.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          MASSIVE_PAID: '1'
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      # OCTOPUS daily: rank the whole market with the model trained on Sunday; top 5 logged as live paper picks.
      - shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          MODE=daily node octopus.mjs 2>&1 | tee -a run.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "movers / fast movers (owner fail marks filter)" || PF=1; else echo "producer failed: owner-derived outputs are NOT saved as current (the failure step keeps them as private quarantine)"; fi   # P0 class B
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          SAVE_GUARD_PHASE=stage node .github/save-privacy-guard.mjs   # P0: stages data/ except every private path (owner files pulled above stay unstaged)
          git diff --cached --quiet || git commit -m "movers $(date -u +%FT%RZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the data folder to the repository" | tee -a run.log; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # If anything above failed, tell the owner on Telegram straight away.
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "movers / fast movers (owner fail marks filter)" fastmover-lab.json fastmover-paper.json ignition-lab.json ignition-results.json
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
