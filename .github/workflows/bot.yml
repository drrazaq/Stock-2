name: Telegram bot replies
# The bot now stays awake: one run listens to Telegram for about 5.5 hours and answers each message within seconds.
# The schedule below only makes sure a new run is waiting when the old one ends (GitHub queues one run in the "bot" group).
# GitHub Actions minutes are free for public repositories.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      accounting_preflight:
        type: boolean
        default: false
        description: Read-only protected accounting preflight; no bot run
permissions:
  contents: write
  actions: write   # (28 Oct) the watcher guard may start ignition.yml when GitHub has not started it by 9:10 New York
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.accounting_preflight && 'accounting-preflight' || 'bot' }}
  cancel-in-progress: false
jobs:
  reply:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.accounting_preflight) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          save() {
            git add data
            git diff --cached --quiet && return 0
            git commit -q -m "bot $(date -u +%FT%RZ)"
            for i in 1 2 3 4 5; do if git pull -q --rebase -X theirs && git push -q; then return 0; fi; git rebase --abort 2>/dev/null || true; sleep 5; done
            echo "Error: could not save the data folder to the repository" | tee -a run.log
          }
          # privacy migration stage 1 (28 Oct): keep a copy of the owner's private files in the private repository. Does nothing
          # without the PRIVATE_DATA_TOKEN secret or before the connection check passed; never stops the bot.
          mirror() { bash .github/private-data.sh mirror >> run.log 2>&1 || true; }
          end=$(( $(date +%s) + 330*60 )); last_full=0; : > run.log
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase -X theirs 2>/dev/null || git rebase --abort 2>/dev/null || true
            now=$(date +%s)
            if [ $((now - last_full)) -ge 300 ]; then
              # every 5 minutes: the full check (your stops and targets, fast movers, watchdog) plus messages
              node scan.mjs >> run.log 2>&1 || echo "full check failed" >> run.log
              node watcher-guard.mjs >> run.log 2>&1 || echo "watcher guard failed" >> run.log   # (28 Oct) is the live watcher running? start it if not
              last_full=$now
            else
              # in between: wait up to 25 seconds for a message and answer it at once
              BOT_ONLY=1 TG_WAIT=25 node scan.mjs >> run.log 2>&1 || { echo "reply failed" >> run.log; sleep 5; }
            fi
            save; mirror
            tail -c 200000 run.log > run.tmp && mv run.tmp run.log
          done
        env:
          MODE: chat
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RATE: ${{ vars.RATE || '8' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
  accounting-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.accounting_preflight }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Verify immutable offline checker
        shell: bash
        run: |
          set -euo pipefail
          set +x
          rm -f "$RUNNER_TEMP/accounting-preflight.result"
          curl --max-time 20 -fsSL https://api.github.com/repos/drrazaq/Stock-2/git/blobs/92fc955497950df6e76823eec6e348f1ebfb78b1 -o "$RUNNER_TEMP/accounting-preflight-source.json" 2>/dev/null
          node -e 'const fs=require("node:fs"),p=process.env.RUNNER_TEMP,j=JSON.parse(fs.readFileSync(p+"/accounting-preflight-source.json"));if(j.encoding!=="base64")process.exit(1);fs.writeFileSync(p+"/accounting-preflight.mjs",Buffer.from(j.content,"base64"));' >/dev/null 2>&1
          printf '7d009d803cd565f5edecc43f52dd9f8fc579837c8a76612ff2c7c580e8473b48  %s/accounting-preflight.mjs\n' "$RUNNER_TEMP" | sha256sum -c --status
          test "$(git hash-object --no-filters "$RUNNER_TEMP/accounting-preflight.mjs")" = 92fc955497950df6e76823eec6e348f1ebfb78b1
      - name: Protected offline pending-sale check
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set +x
          ulimit -c 0
          unset NODE_OPTIONS NODE_PATH
          rc=0
          timeout 10s node --max-old-space-size=256 "$RUNNER_TEMP/accounting-preflight.mjs" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/accounting-preflight.raw" 2>/dev/null || rc=$?
          value=$(cat "$RUNNER_TEMP/accounting-preflight.raw" 2>/dev/null)
          case "$rc:$value" in 0:PASS|2:BLOCKED|1:ERROR) ;; *) value=ERROR ;; esac
          printf '%s\n' "$value" > "$RUNNER_TEMP/accounting-preflight.result"
          rm -f "$RUNNER_TEMP/accounting-preflight.raw"
      - name: Emit only protected result after state freshness check
        id: result
        if: always()
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set +x
          value=$(cat "$RUNNER_TEMP/accounting-preflight.result" 2>/dev/null || true)
          case "$value" in PASS|BLOCKED|ERROR) ;; *) value=ERROR ;; esac
          if [ "$value" = PASS ]; then
            if git fetch --quiet https://github.com/drrazaq/Stock-2.git refs/heads/main >/dev/null 2>&1; then
              if ! git diff --quiet HEAD FETCH_HEAD -- data/private.enc data/my-positions.json data/my-trades.jsonl data/leaderdip-ledger.jsonl; then value=BLOCKED; fi
            else value=ERROR; fi
          fi
          printf 'status=%s\n' "$value" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$value"
          rm -f "$RUNNER_TEMP/accounting-preflight.result" "$RUNNER_TEMP/accounting-preflight.mjs" "$RUNNER_TEMP/accounting-preflight-source.json"
          case "$value" in PASS) exit 0 ;; BLOCKED) exit 2 ;; *) exit 1 ;; esac
