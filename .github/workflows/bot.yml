name: Telegram bot replies
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: bot
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always start from the newest saved state. Without this a run that was queued behind another one starts from an
      # older copy and then overwrites what the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node scan.mjs 2>&1 | tee run.log
        env:
          MODE: chat
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RATE: ${{ vars.RATE || '8' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "bot $(date -u +%FT%RZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the data folder to the repository" | tee -a run.log; exit 1; }
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          [ $((10#$(date -u +%M))) -lt 10 ] || exit 0   # the bot runs every 5 minutes: warn about once an hour, not every time
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
