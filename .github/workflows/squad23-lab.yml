name: Squad 23 lab
# SQUAD 23: "A SECOND HALAL BASKET NEXT TO BASKET 1" (squad23-lab.mjs; 25 Oct 2026). Five candidates pre-registered in squad23-core.mjs and
# data/strategy-library.json before any run (Shariah ranks 21-50 cap-weighted; the 30 most gross-profitable of Shariah ranks 101-500; the
# UMMA halal world fund; a GLD gold sleeve; the 30 best 12-1 momentum names of Shariah ranks 21-100). Each one is judged alone vs SPUS / SPY
# and as 30% added to Basket 1 (SQ10-SH20-C15) vs Basket 1 alone; each 5-year test runs ONCE (first complete verdict frozen in
# data/squad23-lab.json firstRun). BASKET study: NOT a TRY SMALL lab (scan.mjs does not read it). The price cache and Squad 4's, 5's, 10's
# and 17's caches are RESTORED READ ONLY (never saved under their keys); Squad 10's and 17's files are copied into this lab's own cache
# (squad23-cache), the only cache saved. Commits only its own output files and its own library entries. Never places an order.
# Start by hand: change run-squad23-now.txt (a last line containing DIAG = data and structure check only, nothing judged) or run the workflow.
on:
  schedule:
    - cron: '43 0 * * 2-6'   # weekday evenings after the close: today's holdings + paper marks
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad23-now.txt']
permissions:
  contents: write
concurrency: squad23-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad5-cache
          key: squad5-cache-none
          restore-keys: squad5-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad10-cache
          key: squad10-cache-none
          restore-keys: squad10-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad17-cache
          key: squad17-cache-none
          restore-keys: squad17-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad23-cache
          key: squad23-cache-${{ github.run_id }}
          restore-keys: squad23-cache-
      - shell: bash
        run: |
          mkdir -p squad23-cache
          if [ -d squad17-cache ]; then cp -rn squad17-cache/. squad23-cache/ || true; fi
          if [ -d squad10-cache ]; then cp -rn squad10-cache/. squad23-cache/ || true; fi
          rm -rf squad10-cache squad17-cache
          df -h . | tail -1; du -sh study-cache squad4-cache squad5-cache squad23-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 300
        run: |
          set -o pipefail
          if tail -n 1 run-squad23-now.txt | grep -q DIAG && [ "${{ github.event_name }}" = "push" ]; then export DIAG=1; fi
          node squad23-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ23_MINUTES: '285'
      - if: success() || failure()
        shell: bash
        run: rm -rf squad23-cache/*.zip squad23-cache/cf-tmp*; du -sh squad23-cache 2>/dev/null || true
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad23-cache
          key: squad23-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad23-run.log 2>/dev/null || true
          FILES="data/squad23-lab.json data/squad23-paper.jsonl data/squad23-today.json data/squad23-board.json data/squad23-run.log data/squad23-diag.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 23 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 23 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad23-lab-log
          path: run.log
