name: Decoded lab
# DECODED LAB (decoded-lab.mjs; owner's request of 23 Oct 2026: "study how people won on past trades and try to implement them on future
# trades"; batch 2 the same day: "study more, dig"). Weekday evenings after the US close: scans the day for the decoded trader methods
# (batch 1 DEC-* in decoded-core.mjs; batch 2 DEC2-* in decoded2-core.mjs: 35 more trader methods + 48 exit versions + 8 champion
# filters), records PAPER signals from 23 Oct 2026 (entries from Monday 26 Oct), resolves them with
# each method's own exit, and runs each method's 5-year one-shot once (first verdict frozen). The whole-market price cache is RESTORED READ
# ONLY from the Sunday job (never saved here); the sessions since are fetched from Massive. Commits only its own output files and its own
# library entries. Never places an order. Start by hand: change run-decoded-now.txt (or run the workflow).
on:
  schedule:
    - cron: '40 22 * * 1-5'   # 22:40 UTC = 6:40 pm New York in summer time, 5:40 pm in winter: after the close and the daily bars
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-decoded-now.txt']
permissions:
  contents: write
concurrency: decoded-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      # batch 2 (DEC2-CONTRACT, DEC2-INSQ): the SEC 8-K event cache and value-lab's SEC companyfacts cache, RESTORED READ ONLY (never saved here)
      - uses: actions/cache/restore@v4
        with:
          path: ev-cache
          key: events-cache-none
          restore-keys: events-cache-
      - uses: actions/cache/restore@v4
        with:
          path: value-cache
          key: value-cache-none
          restore-keys: value-cache-
      - shell: bash
        timeout-minutes: 100
        run: |
          set -o pipefail
          if tail -n 1 run-decoded-now.txt | grep -q HISTORY; then export HISTORY=1; fi
          if tail -n 1 run-decoded-now.txt | grep -q 'CHECK TPS'; then export CHECK=TPS; fi
          node decoded-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/decoded-run.log 2>/dev/null || true
          FILES="data/decoded-paper.jsonl data/decoded-today.json data/decoded-board.json data/decoded-history.json data/decoded-run.log data/decoded-check.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "decoded lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the decoded lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: decoded-lab-log
          path: run.log
