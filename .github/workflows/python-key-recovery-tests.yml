name: Python offline key recovery tests
on:
  push:
    branches: [Stock2-safety-fixes]
    paths:
      - 'tools/recover-key-proof.py'
      - 'tools/recover-phase-a.py'
      - 'tests/test_phase_a_recovery.py'
      - 'tests/test_key_proof_python.py'
      - 'tests/fixtures/key-proof-node-v1.json'
      - '.github/workflows/python-key-recovery-tests.yml'
  pull_request:
    paths:
      - 'tools/recover-key-proof.py'
      - 'tools/recover-phase-a.py'
      - 'tests/test_phase_a_recovery.py'
      - 'tests/test_key_proof_python.py'
      - 'tests/fixtures/key-proof-node-v1.json'
      - '.github/workflows/python-key-recovery-tests.yml'
permissions:
  contents: read
jobs:
  offline-recovery:
    if: github.head_ref == 'Stock2-safety-fixes' || github.ref_name == 'Stock2-safety-fixes'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9.16'
            crypto: '46.0.3'
          - python: '3.9.16'
            crypto: '3.3.2'
          - python: '3.12'
            crypto: '46.0.3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install authenticated crypto implementation for fixture tests
        run: python -m pip install 'cryptography==${{ matrix.crypto }}'
      - name: Offline public-fixture recovery tests (no owner key or data)
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
