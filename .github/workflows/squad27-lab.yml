name: Squad 27 lab
# SQUAD 27 (squad27-lab.mjs; 27 Oct 2026): ODD-LOT ISSUER TENDER ARBITRAGE (SQ27-ODDLOT, pre-registered in squad27-core.mjs and
# data/strategy-library.json before any run). History: every SC TO-I / SC TO-I/A 2019..now from the official EDGAR full index, cached
# in squad27-cache; the first complete result is frozen in data/squad27-lab.json firstRun and never re-run. Weekly paper lane: every
# run refreshes data/squad27-board.json (open odd-lot issuer tender offers) and appends new offers to data/squad27-paper.jsonl.
# RECORD ONLY: no Telegram, never places an order. Started by a push of run-squad27-now.txt, by hand, or weekly (Monday).
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad27-now.txt']
permissions:
  contents: write
concurrency: squad27-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: squad27-cache
          key: squad27-cache-${{ github.run_id }}
          restore-keys: squad27-cache-
      - shell: bash
        run: du -sh squad27-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 310
        run: |
          set -o pipefail
          node squad27-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ27_MINUTES: '290'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad27-cache
          key: squad27-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad27-run.log 2>/dev/null || true
          FILES="data/squad27-lab.json data/squad27-offers.json data/squad27-board.json data/squad27-paper.jsonl data/squad27-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 27 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 27 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad27-lab-log
          path: run.log
