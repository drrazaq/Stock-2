name: Verify lab
# INDEPENDENT CHECK (verify-lab.mjs, 24 Oct 2026): SQ6-MTUM and SQ1-BBAUTH re-implemented from their written specs (verify-core.mjs, no
# squad rule code), run on the same whole-market price cache, compared trade by trade with the squads' frozen outputs. The price cache is
# RESTORED READ ONLY; only this lab's own cache (verify-cache: EDGAR search hits and parsed documents) is saved. Keys only from secrets,
# never printed. Commits only data/verify-lab.json. Never places an order. Starts on a push of its own files or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['verify-lab.mjs', 'verify-core.mjs', '.github/workflows/verify-lab.yml']
permissions:
  contents: write
concurrency: verify-lab
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/verify-core.test.mjs
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: verify-cache
          key: verify-cache-${{ github.run_id }}
          restore-keys: verify-cache-
      - shell: bash
        timeout-minutes: 180
        run: |
          set -o pipefail
          node verify-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          VERIFY_MINUTES: '160'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: verify-cache
          key: verify-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "verify lab (computed from private ledgers)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "verify lab (computed from private ledgers)" verify-lab.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          [ -f data/verify-lab.json ] || { echo "Error: no verify result"; exit 1; }
          cp data/verify-lab.json "$RUNNER_TEMP/verify-lab.json"
          git reset -q --hard && git pull -q --rebase
          cp "$RUNNER_TEMP/verify-lab.json" data/verify-lab.json
          true   # P0: its outputs are private (saved above)
          git diff --cached --quiet || git commit -m "verify lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the verify result"; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "verify lab (computed from private ledgers)" verify-lab.json
