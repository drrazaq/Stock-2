name: Squad 29 lab
# SQUAD 29 (squad29-lab.mjs; 27 Oct 2026): RED-FLAG SEC FILINGS AS SELL WARNINGS. Six flag families pre-registered in squad29-core.mjs and
# data/strategy-library.json (SQ29-F1..F6) before any run: 8-K 4.02 restatement, auditor resigned (4.01), CEO/CFO gone without successor
# (5.02), NT 10-K/10-Q, first-time going-concern doubt, 8-K 3.01 delisting notice. A push of run-squad29-now.txt runs the lab (last line DIAG =
# coverage check only, no returns): each family judged ONCE on 5 years (first complete verdict frozen in data/squad29-lab.json firstRun).
# Weekdays (twice: before the open and after the close) it only refreshes data/squad29-flags-today.json (flags of the last 5 sessions, any
# stock) and the holdings check: RECORD ONLY, no Telegram, never an order. data/my-positions.json is READ ONLY. The price cache and squad 4's
# Form 3/4/5 ticker map are RESTORED READ ONLY; only this lab's own cache (squad29-cache) is saved. Commits only its own files.
on:
  schedule:
    - cron: '41 10 * * 1-5'   # before the New York open (after-close and overnight filings)
    - cron: '23 22 * * 1-5'   # after the close
  workflow_dispatch:
    inputs:
      mode:
        description: 'lab | diag | today (empty = the last line of run-squad29-now.txt decides; schedule = today)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['run-squad29-now.txt']
permissions:
  contents: write
concurrency:
  group: squad29-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad29-cache
          key: squad29-cache-${{ github.run_id }}
          restore-keys: squad29-cache-
      - shell: bash
        run: du -sh study-cache squad4-cache squad29-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 320
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then MODE=today
            elif tail -n 1 run-squad29-now.txt | grep -q DIAG; then MODE=diag
            else MODE=lab; fi
          fi
          echo "mode: $MODE"; export MODE
          node squad29-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ29_MINUTES: '295'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad29-cache
          key: squad29-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad29-run.log 2>/dev/null || true
          FILES="data/squad29-lab.json data/squad29-flags-today.json data/squad29-diag.json data/squad29-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 29 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 29 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad29-lab-log
          path: run.log
