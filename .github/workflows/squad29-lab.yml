name: Squad 29 lab
# SQUAD 29 (squad29-lab.mjs; 27 Oct 2026): RED-FLAG SEC FILINGS AS SELL WARNINGS. Six flag families pre-registered in squad29-core.mjs and
# data/strategy-library.json (SQ29-F1..F6) before any run: 8-K 4.02 restatement, auditor resigned (4.01), CEO/CFO gone without successor
# (5.02), NT 10-K/10-Q, first-time going-concern doubt, 8-K 3.01 delisting notice. A push of run-squad29-now.txt runs the lab (last line DIAG =
# coverage check only, no returns): each family judged ONCE on 5 years (first complete verdict frozen in data/squad29-lab.json firstRun).
# Weekdays (twice: before the open and after the close) it only refreshes data/squad29-flags-today.json (flags of the last 5 sessions, any
# stock) and the holdings check: RECORD ONLY, no Telegram, never an order. data/my-positions.json is READ ONLY. The price cache and squad 4's
# Form 3/4/5 ticker map are RESTORED READ ONLY; only this lab's own cache (squad29-cache) is saved. Commits only its own files.
on:
  schedule:
    - cron: '41 10 * * 1-5'   # before the New York open (after-close and overnight filings)
    - cron: '23 22 * * 1-5'   # after the close
  workflow_dispatch:
    inputs:
      mode:
        description: 'lab | diag | today (empty = the last line of run-squad29-now.txt decides; schedule = today)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['run-squad29-now.txt']
permissions:
  contents: write
concurrency:
  group: squad29-lab
  cancel-in-progress: false
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - name: Install squad29's own cache from the PRIVATE store (P0, Codex 6856231228)
        # its SEC submissions set includes the owner's held CIKs: it lives only as the archive data/squad29-cache.tar.gz, never in the public
        # Actions cache. Missing = UNKNOWN: the lab STOPS (no empty start, no refetch); custody import required.
        run: |
          rc=0; bash .github/private-cache.sh install-dir squad29-cache.tar.gz squad29-cache || rc=$?
          if [ "$rc" = 3 ]; then echo "- squad29: UNKNOWN, private cache unavailable (custody import required); stopped" >> "$GITHUB_STEP_SUMMARY"; exit 1; elif [ "$rc" != 0 ]; then exit 1; fi
      - shell: bash .github/private-shell.sh pipefail {0}
        run: du -sh study-cache squad4-cache squad29-cache 2>/dev/null || true
      - shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 320
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then MODE=today
            elif tail -n 1 run-squad29-now.txt | grep -q DIAG; then MODE=diag
            else MODE=lab; fi
          fi
          echo "mode: $MODE"; export MODE
          node squad29-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ29_MINUTES: '295'
      - if: success() || failure()
        name: Stage squad29's own cache for the private save (P0; never the public Actions cache)
        run: bash .github/private-cache.sh stage-dir squad29-cache squad29-cache.tar.gz
      - if: success() || failure()
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad29-run.log 2>/dev/null || true
          PF=0; if [ "${{ job.status == 'success' }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "squad29 (owner holdings, danger filings)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "squad29 (owner holdings, danger filings)" squad29-cache.tar.gz squad29-lab.json squad29-flags-today.json squad29-diag.json squad29-run.log || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          FILES=""
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ job.status == 'success' }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 29 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 29 lab result"; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "squad29 (owner holdings, danger filings)" squad29-cache.tar.gz squad29-lab.json squad29-flags-today.json squad29-diag.json squad29-run.log
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)