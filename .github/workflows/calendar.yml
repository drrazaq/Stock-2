name: Economic calendar
on:
  schedule:
    - cron: '45 20 * * 1-5'
    - cron: '30 5 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendar
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Economic calendar: release dates from the official BLS and Federal Reserve schedules, actual values from Alpha Vantage,
      # TipRanks only as a weekly fallback (its monthly calls are scarce) + Massive holidays and your dividends.
      # Saved ENCRYPTED (data/calendar.enc): TipRanks data may not be republished and this repository is public.
      - shell: bash .github/private-shell.sh pipefail {0}
        run: |
          set -o pipefail
          node calendar.mjs 2>&1 | tee run.log
        env:
          TIPRANKS_KEY: ${{ secrets.TIPRANKS_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      # SEC share counts (first run reads ~30 quarters, then 3 requests a day): dilution flag + float known on past days.
      - if: always()
        shell: bash .github/private-shell.sh pipefail {0}
        continue-on-error: true
        run: node shares.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      # System health: did every job produce fresh results? Telegram message only when something silently stopped.
      - if: always()
        shell: bash .github/private-shell.sh pipefail {0}
        continue-on-error: true
        run: node health.mjs 2>&1 | tee -a run.log
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - if: always()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "calendar (dividends of held stocks; held-stock count)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "calendar (dividends of held stocks; held-stock count)" calendar.enc calendar-status.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          for f in data/health.json data/shares.json.gz; do [ -f "$f" ] && git add "$f"; done; true   # P0: calendar.enc and calendar-status.json are private (saved above)
          git diff --cached --quiet || git commit -m "calendar $(date -u +%FT%RZ)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "calendar (dividends of held stocks; held-stock count)" calendar.enc calendar-status.json
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|cannot|failed|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
