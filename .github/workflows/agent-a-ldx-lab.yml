name: Agent A leader dip exits
# A-LDX1 (Agent A, 1 Nov 2026; agent-a-ldx-lab.mjs): exit questions on the owner's live LEADER DIP lane (SQ11-PB12 entries, +20% sell limit,
# 126-session time exit, no stop, 3 slots): a halfway check (LDX-HALF63), a 200-day trend-break exit (LDX-T200) and a 189-session time exit
# (LDX-TIME189), trade by trade and as the 3-slot account. Pre-registered in agent-a-ldx-core.mjs and data/strategy-library.json (LDX-*)
# before any run; run ONCE (first complete result frozen in data/agent-a-ldx-lab.json firstRun). The price cache is RESTORED READ ONLY.
# Commits only its own output files and its own library entries. Never places an order; no Telegram.
# Start by hand: change run-agent-a-ldx-now.txt (a last line containing DIAG = data check only) or run the workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-agent-a-ldx-now.txt']
permissions:
  contents: write
concurrency: agent-a-ldx-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - shell: bash
        timeout-minutes: 70
        run: |
          set -o pipefail
          du -sh study-cache 2>/dev/null || true
          if tail -n 1 run-agent-a-ldx-now.txt | grep -q DIAG && [ "${{ github.event_name }}" = "push" ]; then export DIAG=1; fi
          node agent-a-ldx-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 200 run.log | cut -c1-2500 > data/agent-a-ldx-run.log 2>/dev/null || true
          FILES="data/agent-a-ldx-lab.json data/agent-a-ldx-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "agent A leader dip exits $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the agent A leader dip exits result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-a-ldx-log
          path: run.log
