name: Squad 19 lab
# SQUAD 19 (25 Oct 2026): the same-day jump - under-5 USD stocks that jump 40-100%+ in one day (squad19-core.mjs, squad19-lab.mjs).
# run-squad19-now.txt  -> STAGE 1 case study + the owner's daily-bar candidates (plan -> 8 minute-bar shards + daily -> report).
# run-squad19-judge.txt -> STAGE 2: the pre-registered intraday rules judged ONCE on the Stage 1 rows (restored from the cache).
# Weekday evenings: paper lane of the Stage 2 rules (idle until rules exist). Never places an order.
on:
  schedule:
    - cron: '41 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad19-now.txt', 'run-squad19-judge.txt', 'run-squad19-rh1.txt']
permissions:
  contents: write
concurrency: squad19-lab
env:
  SHARDS: '8'
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.r.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require squad19-lab.json squad19-paper.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - id: r
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then echo "stage=paper" >> "$GITHUB_OUTPUT";
          elif git diff --name-only HEAD~1 HEAD | grep -q 'run-squad19-judge.txt'; then echo "stage=judge" >> "$GITHUB_OUTPUT";
          elif git diff --name-only HEAD~1 HEAD | grep -q 'run-squad19-rh1.txt'; then echo "stage=rh1" >> "$GITHUB_OUTPUT";
          else echo "stage=full" >> "$GITHUB_OUTPUT"; fi
  plan:
    needs: route
    if: needs.route.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require squad19-lab.json squad19-paper.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: sq19-daily
          key: sq19-daily-v1-${{ github.run_id }}
          restore-keys: sq19-daily-v1-
      - shell: bash
        run: |
          set -o pipefail
          node squad19-lab.mjs plan 2>&1 | tee plan.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: sq19-daily
          key: sq19-daily-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: sq19-plan
          path: |
            sq19-work/plan.json.gz
            plan.log
          retention-days: 5
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require squad19-lab.json squad19-paper.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: sq19-plan
      - shell: bash
        timeout-minutes: 320
        run: |
          set -o pipefail
          node squad19-lab.mjs shard 2>&1 | tee shard.log
        env:
          SHARD: ${{ matrix.shard }}
          SQ19_MINUTES: '300'
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: sq19-shard-${{ matrix.shard }}
          path: |
            sq19-work/shard-${{ matrix.shard }}.json.gz
            shard.log
          retention-days: 5
  daily:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require squad19-lab.json squad19-paper.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: sq19-daily
          key: sq19-daily-v1-${{ github.run_id }}
          restore-keys: sq19-daily-v1-
      - shell: bash
        run: |
          set -o pipefail
          node squad19-lab.mjs daily 2>&1 | tee daily.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: sq19-daily
          key: sq19-daily-v1-${{ github.run_id }}-d
      - uses: actions/upload-artifact@v4
        with:
          name: sq19-daily-out
          path: |
            sq19-work/daily-out.json
            daily.log
          retention-days: 5
  report:
    needs: [plan, shard, daily]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require squad19-lab.json squad19-paper.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/download-artifact@v4
        with:
          pattern: sq19-*
          merge-multiple: true
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p sq19-work; ls -la sq19-work
          cat plan.log > run.log 2>/dev/null || true
          for f in shard.log daily.log; do [ -f "$f" ] && tail -n 40 "$f" >> run.log; done; true
          node squad19-lab.mjs sec 2>&1 | tee -a run.log
          node squad19-lab.mjs report 2>&1 | tee -a run.log
          node squad19-lab.mjs mergeDaily 2>&1 | tee -a run.log
          node squad19-lab.mjs judge 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - uses: actions/cache/save@v4
        with:
          path: sq19-work
          key: sq19-rows-v1-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad19-run.log 2>/dev/null || true
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "squad19 (owner marks)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "squad19 (owner marks)" squad19-lab.json squad19-today.json squad19-board.json squad19-paper.jsonl squad19-run.log squad19-rh1-fm.json squad19-rh1-fm.md squad19-rh1-raw.json squad19-rh1-raw.md squad19-rh1-run.log squad19-diag.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          FILES=""
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "::warning::research registry: NOT published and NOT durable (not in private mode)"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad19 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad19 lab result"; exit 1; }
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "squad19 (owner marks)" squad19-lab.json squad19-today.json squad19-board.json squad19-paper.jsonl squad19-run.log squad19-rh1-fm.json squad19-rh1-fm.md squad19-rh1-raw.json squad19-rh1-raw.md squad19-rh1-run.log squad19-diag.json
  rh1:
    needs: route
    if: needs.route.outputs.stage == 'rh1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
