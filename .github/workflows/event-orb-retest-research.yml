name: Event ORB Retest Research

# Research only, run by hand: no schedule, no Telegram, no BUY line, no scan/league file touched.
# Chain: events (EDGAR 8-K acceptance times) -> requests -> 5-minute bars (Massive, cached) -> paper ledger -> lane study
# (events and matched non-event controls) -> Stock-2 gates -> A-EVR1 library entry. Commits only data/ outputs (not the bars).
on:
  workflow_dispatch:
    inputs:
      max_events:
        description: 'Newest strict events to test (1-500; the supplied requests script caps at 500)'
        required: false
        default: '500'
        type: string
      years:
        description: 'How many years of 8-K history to read from EDGAR'
        required: false
        default: '2'
        type: string

permissions:
  contents: write

concurrency:
  group: stock2-event-orb-retest-research
  cancel-in-progress: false

# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      EVENT_ORB_MAX_EVENTS: ${{ inputs.max_events }}
      EVR_YEARS: ${{ inputs.years }}
      EVR_CALLS: '2500'
      EVR_MINUTES: '35'
      EVR_SEC_CALLS: '600'
      EVR_SEC_MINUTES: '20'
    steps:
      - uses: actions/checkout@v4
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the frozen research core
        run: |
          node --check event-orb-retest-core.mjs
          node --check event-orb-retest-events.mjs
          node --check event-orb-retest-bars.mjs
          node --check event-orb-retest-gates.mjs
          node test/event-orb-retest-core.test.mjs
      - name: Install the lane-private caches (EDGAR pages, 5-minute bars) from the PRIVATE store (P0, Codex 6856207421)
        # their membership follows the owner's private event set: they live only as data/evr-sec.json.gz and data/evr-min.json.gz, never
        # in the public Actions cache. Missing = UNKNOWN: the lane STOPS (no empty start, no fresh acquisition); custody import required.
        run: |
          for n in evr-sec evr-min; do rc=0; bash .github/private-cache.sh install-file $n.json.gz fm-cache/$n.json.gz || rc=$?
            if [ "$rc" = 3 ]; then echo "- event-orb lane: UNKNOWN, private cache $n unavailable (custody import required); stopped" >> "$GITHUB_STEP_SUMMARY"; exit 1; elif [ "$rc" != 0 ]; then exit 1; fi; done
      - run: bash .github/private-data.sh require strategy-library.json event-orb-retest-15d-paper.json catalyst-events.jsonl && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - name: Events from EDGAR (strict envelope) and matched controls
        run: node event-orb-retest-events.mjs 2>&1 | tee -a run.log
      - name: Bar requests (events, then controls)
        run: |
          set -o pipefail
          node event-orb-retest-requests.mjs 2>&1 | tee -a run.log
          EVENT_ORB_EVENTS=data/event-orb-retest-15d-controls.jsonl EVENT_ORB_REQUESTS=data/event-orb-retest-15d-control-requests.json node event-orb-retest-requests.mjs 2>&1 | tee -a run.log
      - name: Five-minute bars from Massive (cached, budgeted)
        run: node event-orb-retest-bars.mjs 2>&1 | tee -a run.log
      - name: Paper ledger (append-only), lane study, control study
        run: |
          set -o pipefail
          node event-orb-retest-paper-ledger.mjs 2>&1 | tee -a run.log
          node event-orb-retest-study.mjs 2>&1 | tee -a run.log
          EVENT_ORB_EVENTS=data/event-orb-retest-15d-controls.jsonl EVENT_ORB_STUDY=data/event-orb-retest-15d-control-study.json node event-orb-retest-study.mjs 2>&1 | tee -a run.log
      - name: Stock-2 gates and the A-EVR1 library entry
        run: |
          set -o pipefail
          node event-orb-retest-gates.mjs 2>&1 | tee -a run.log
          node event-orb-retest-library.mjs 2>&1 | tee -a run.log
      - if: always()
        name: Stage the lane-private caches for the private save (P0; never the public Actions cache)
        run: for n in evr-sec evr-min; do bash .github/private-cache.sh stage-file fm-cache/$n.json.gz $n.json.gz; done
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)
      - name: Commit the data outputs
        if: always()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # P0: the event universe is the owner's ok marks plus the watch universe minus the owner's fail marks, so every event, control,
          # request, coverage, paper and study file below is owner-derived: private route only; a failure fails the job visibly
          PF=0; if [ "${{ success() }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "event-orb-retest" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "event-orb-retest" evr-sec.json.gz evr-min.json.gz catalyst-events.jsonl event-orb-retest-15d-events.json event-orb-retest-15d-controls.jsonl event-orb-retest-15d-requests.json event-orb-retest-15d-control-requests.json event-orb-retest-15d-bars-coverage.json event-orb-retest-15d-paper.json event-orb-retest-15d-study.json event-orb-retest-15d-control-study.json event-orb-retest-15d-gates.json || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json" 2>/dev/null || true
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "event ORB retest research $(date -u +%FT%RZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ]
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
          [ "$PF" = 0 ] || exit 1
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "event-orb-retest" evr-sec.json.gz evr-min.json.gz catalyst-events.jsonl event-orb-retest-15d-events.json event-orb-retest-15d-controls.jsonl event-orb-retest-15d-requests.json event-orb-retest-15d-control-requests.json event-orb-retest-15d-bars-coverage.json event-orb-retest-15d-paper.json event-orb-retest-15d-study.json event-orb-retest-15d-control-study.json event-orb-retest-15d-gates.json
