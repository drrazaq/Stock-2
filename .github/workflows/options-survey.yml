name: Options spread survey
# ONE-OFF INFORMATION SURVEY (options-survey.mjs; 27 Oct 2026): today's OPRA call quotes (45-180 days) on the 30 most liquid ZAD-halal-ok
# US stocks: ATM cost and half-spread, the cheapest call <= 300 USD with delta >= 0.30. Writes data/options-spread-survey.json / .md only.
# Never places an order. Start by hand: workflow_dispatch, or change run-options-survey-now.txt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-options-survey-now.txt']
permissions:
  contents: write
concurrency: options-survey
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node options-survey.mjs 2>&1 | tee run.log
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # P0: the survey universe is the owner's ok marks: owner-derived outputs go ONLY to the private route; a failure fails the job visibly
          PF=0; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "options-survey" || PF=1   # explicit outcome: verified private save, or NOT DURABLE (never a silent green)
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          [ "$PF" = 0 ] || exit 1
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "options-survey" options-spread-survey.json options-spread-survey.md
