name: Options spread survey
# ONE-OFF INFORMATION SURVEY (options-survey.mjs; 27 Oct 2026): today's OPRA call quotes (45-180 days) on the 30 most liquid ZAD-halal-ok
# US stocks: ATM cost and half-spread, the cheapest call <= 300 USD with delta >= 0.30. Writes data/options-spread-survey.json / .md only.
# Never places an order. Start by hand: workflow_dispatch, or change run-options-survey-now.txt.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-options-survey-now.txt']
permissions:
  contents: write
concurrency: options-survey
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node options-survey.mjs 2>&1 | tee run.log
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # P0: the survey universe is the owner's ok marks: owner-derived outputs go ONLY to the private route; a failure fails the job visibly
          PF=0; if [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh push || { PF=1; echo "Error: owner-derived outputs NOT stored privately; they stay on this runner only"; }; else echo "not in private mode: owner-derived outputs are NOT published (privacy)"; fi
          [ "$PF" = 0 ] || exit 1
