name: Tests
# Regression tests for the money-critical fixes (test/*.test.mjs). No secrets and no network: every test runs on fixture files,
# and test/load-scan.mjs refuses any request that is not to localhost.
on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify inactive V2 integration before the complete regression suite
        shell: bash
        run: |
          for f in test/repo03-host-storage.test.mjs test/sec-v2-host-guard.test.mjs test/sec-v2-host.test.mjs test/repo03-host-monitor.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "PASS $f"
            echo "::endgroup::"
          done
      - name: Verify REPO-03 source inventory and non-destructive verifier behavior
        run: |
          python -m unittest discover -s tests -p 'test_repository_behavior.py'
          python -m unittest discover -s tests -p 'test_incident_verifier_evidence.py'
      - name: Verify gated actual-watcher callers against the explicit development contract
        env:
          INCIDENT_WATCHER_SRC: ${{ github.workspace }}/ignition-watch.mjs
          INCIDENT_WATCHER_PROFILE: development-full
        run: |
          node test/watcher-incident-revision.test.mjs
          node test/watcher-resilience.test.mjs
      - name: Run every test file
        shell: bash
        run: |
          failed=0
          # These suites use private mkdtemp roots and port-0 loopback servers.
          # Buffer their logs, retain every exit status, and emit complete file
          # groups after waiting. No retry, timeout extension or failure allowance.
          isolated_files=(test/a-first-entry-panels.test.mjs test/a-first-original-inputs.test.mjs test/native-sec-colocated-host.test.mjs)
          isolated_pids=()
          isolated_logs=$(mktemp -d "$RUNNER_TEMP/isolated-tests.XXXXXX")
          for i in "${!isolated_files[@]}"; do
            (
              if node "${isolated_files[$i]}" > "$isolated_logs/$i.log" 2>&1; then
                printf '0\n' > "$isolated_logs/$i.status"
              else
                printf '1\n' > "$isolated_logs/$i.status"
              fi
            ) &
            isolated_pids+=("$!")
          done
          for f in test/*.test.mjs; do
            case "$f" in test/repo03-host-storage.test.mjs|test/sec-v2-host-guard.test.mjs|test/sec-v2-host.test.mjs|test/repo03-host-monitor.test.mjs|test/a-first-entry-panels.test.mjs|test/a-first-original-inputs.test.mjs|test/native-sec-colocated-host.test.mjs) continue ;; esac
            echo "::group::$f"
            if node "$f"; then echo "PASS $f"; else echo "::error file=$f::test file failed"; failed=1; fi
            echo "::endgroup::"
          done
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            if node "$f"; then echo "PASS $f"; else echo "::error file=$f::test file failed"; failed=1; fi
            echo "::endgroup::"
          done
          for i in "${!isolated_files[@]}"; do
            f=${isolated_files[$i]}
            echo "::group::$f"
            if ! wait "${isolated_pids[$i]}"; then
              echo "::error file=$f::isolated test process did not complete"
              failed=1
            fi
            if ! cat "$isolated_logs/$i.log"; then
              echo "::error file=$f::isolated test log missing"
              failed=1
            fi
            if [[ -f "$isolated_logs/$i.status" ]] && [[ "$(cat "$isolated_logs/$i.status")" == 0 ]]; then
              echo "PASS $f"
            else
              echo "::error file=$f::test file failed or result missing"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  host-monitor-stress:
    if: github.ref_name == 'Stock2-safety-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Thirty consecutive actual-host success controls, no retries
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            log="$RUNNER_TEMP/host-monitor-$attempt.tap"
            if ! timeout 60s node --test --test-name-pattern='binding success$' test/sec-v2-host.test.mjs > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            python - "$log" <<'PYVERIFY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          assert re.search(r'^# pass 1$',text,re.M), 'expected exactly one executed success control'
          assert re.search(r'^# fail 0$',text,re.M), 'failure cannot be retried'
          assert re.search(r'^# skipped 9$',text,re.M), 'expected nine other scenarios explicitly skipped'
          assert 'ok 1 - actual V2 host/guard/real client binding success' in text
          PYVERIFY
            echo "PASS consecutive actual-host control $attempt/30"
          done
