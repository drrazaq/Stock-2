name: Angles lab
# ANGLES LAB (angles-lab.mjs; owner's request of 24 Oct 2026: more, different ways to make money, angles NOT yet tested). Each ANG-* angle
# (pre-registered in angles-core.mjs and data/strategy-library.json before any run) is tested ONCE on 5 years (first complete verdict frozen
# in data/angles-lab.json), and a forward PAPER ledger records every new signal from Monday 26 Oct 2026 (data/angles-paper.jsonl,
# angles-today.json, angles-board.json).
# Runs on weekday evenings after the close (cached data; only the new days are fetched). The whole-market price cache and quality.mjs's
# SEC cache are RESTORED READ ONLY from the Sunday job and Agent A's Nasdaq calendar cache is restored read only; only this lab's own
# cache (angles-cache) is saved. Commits only its own output files and its own library entries. Never places an order.
# Start by hand: change run-angles-now.txt (or run the workflow).
on:
  schedule:
    - cron: '41 23 * * 1-5'   # weekday evenings after the close: paper lane (and the one-shot of any angle not yet frozen)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-angles-now.txt']
permissions:
  contents: write
concurrency: angles-lab
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: a-cache
          key: a-cache-none
          restore-keys: a-cache-
      - uses: actions/cache/restore@v4
        with:
          path: angles-cache
          key: angles-cache-${{ github.run_id }}
          restore-keys: angles-cache-
      - shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 270
        run: |
          set -o pipefail
          node angles-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ANG_MINUTES: '240'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: angles-cache
          key: angles-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/angles-run.log 2>/dev/null || true
          FILES="data/angles-lab.json data/angles-paper.jsonl data/angles-today.json data/angles-board.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ job.status == 'success' }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "angles lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the angles lab result"; exit 1; }
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)