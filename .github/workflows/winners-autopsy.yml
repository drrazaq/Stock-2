name: Winners autopsy
# WINNER AUTOPSY (winners-autopsy-lab.mjs, owner's request of 23 Oct 2026). Research + a forward paper record; never places an order.
# Trigger (run-winners-now.txt changed, or by hand): 1. discover = the autopsy of the last 90 sessions, winners vs matched controls, and
# the candidate rules PRE-REGISTERED in data/strategy-library.json (ids WIN-...); 2. that pre-registration is COMMITTED AND PUSHED before
# 3. test = the registered rules run once on the 5-year history (first verdict frozen); 4. paper = today's signals into the paper record.
# Weekdays after the close: paper only. This lab's own cache (w-cache: prices, EDGAR index, Nasdaq calendar, industry codes) is saved;
# a-cache (Nasdaq calendar fallback) and study-cache (insider purchases, descriptive) are RESTORED READ ONLY. Commits only its own files
# (data/winners-autopsy.json, data/winners-paper.jsonl, data/winners-board.json, data/winners-autopsy-run.log) and its own library entries.
on:
  schedule:
    - cron: '20 22 * * 1-5'   # weekdays after the US close: paper record only
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-winners-now.txt']
permissions:
  contents: write
concurrency: winners-autopsy
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/cache/restore@v4
        with:
          path: w-cache
          key: winners-cache-${{ github.run_id }}
          restore-keys: winners-cache-
      - uses: actions/cache/restore@v4
        with:
          path: a-cache
          key: a-cache-none
          restore-keys: a-cache-
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - name: Discover (autopsy + pre-registration)
        if: github.event_name != 'schedule'
        shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 260
        run: |
          set -o pipefail
          MODE=discover node winners-autopsy-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          W_MINUTES: '240'
      - if: always() && github.event_name != 'schedule'
        uses: actions/cache/save@v4
        with:
          path: w-cache
          key: winners-cache-${{ github.run_id }}-discover
      - name: Commit the pre-registration before any 5-year run
        if: github.event_name != 'schedule'
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/winners-autopsy-run.log 2>/dev/null || true
          FILES="data/winners-autopsy.json"
          OUTD="$RUNNER_TEMP/reg-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "winners autopsy: candidate rules pre-registered $(date -u +%FT%H:%MZ)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the pre-registration"; exit 1; }
          cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      - name: Test the registered rules once on 5 years
        if: github.event_name != 'schedule'
        shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 60
        run: |
          set -o pipefail
          MODE=test node winners-autopsy-lab.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          W_MINUTES: '50'
      - name: Paper record
        if: success() || failure()
        shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 40
        run: |
          set -o pipefail
          MODE=paper node winners-autopsy-lab.mjs 2>&1 | tee -a run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          W_MINUTES: '30'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: w-cache
          key: winners-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 400 run.log | cut -c1-2000 > data/winners-autopsy-run.log 2>/dev/null || true
          FILES="data/winners-autopsy.json data/winners-paper.jsonl data/winners-board.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "winners autopsy $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the winners autopsy result"; exit 1; }
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)