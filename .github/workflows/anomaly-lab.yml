name: Anomaly lab
# ANOMALY LAB (anomaly-lab.mjs; owner's request of 23 Oct 2026: find every documented way people make money in stocks and test it
# properly). Published long-only return anomalies (ANOM-*, pre-registered in anomaly-core.mjs and data/strategy-library.json before any
# run): each one's 5-year test runs ONCE (first complete verdict frozen in data/anomaly-lab.json), and a forward PAPER ledger records
# every new signal from Monday 26 Oct 2026 (data/anomaly-paper.jsonl, anomaly-today.json, anomaly-board.json).
# Weekly full run on Sunday after the Sunday studies (refreshes SEC facts, dividends, 13F); light runs on weekday evenings so the paper
# lane records each session's signals the same evening (cached data, only the new days are fetched).
# The whole-market price cache is RESTORED READ ONLY from the Sunday job and Agent A's Nasdaq calendar cache is restored read only; only
# this lab's own cache (anomaly-cache) is saved. Commits only its own output files and its own library entries. Never places an order.
# Start by hand: change run-anomaly-now.txt (or run the workflow).
on:
  schedule:
    - cron: '47 13 * * 0'     # Sunday, after the Sunday studies (06:00 UTC, up to 5 hours)
    - cron: '25 23 * * 1-5'   # weekday evenings after the close: paper lane
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-anomaly-now.txt']
permissions:
  contents: write
concurrency: anomaly-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: a-cache
          key: a-cache-none
          restore-keys: a-cache-
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-cache
          key: anomaly-cache-${{ github.run_id }}
          restore-keys: anomaly-cache-
      - shell: bash
        timeout-minutes: 270
        run: |
          set -o pipefail
          node anomaly-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ANOM_MINUTES: '240'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: anomaly-cache
          key: anomaly-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/anomaly-run.log 2>/dev/null || true
          FILES="data/anomaly-lab.json data/anomaly-paper.jsonl data/anomaly-today.json data/anomaly-board.json data/anomaly-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "anomaly lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the anomaly lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-lab-log
          path: run.log
