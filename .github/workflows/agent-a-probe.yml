name: Agent A data probe
# Temporary (23 Oct 2026): which earnings-history and ETF price sources answer from Actions. Commits only data/agent-a-probe.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-agent-a-probe.txt']
permissions:
  contents: write
concurrency: agent-a-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node agent-a-probe.mjs
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
      - shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          cp data/agent-a-probe.json "$RUNNER_TEMP/p.json"
          git reset -q --hard && git pull -q --rebase
          cp "$RUNNER_TEMP/p.json" data/agent-a-probe.json && git add data/agent-a-probe.json
          git diff --cached --quiet || git commit -m "agent A data probe $(date -u +%F)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
