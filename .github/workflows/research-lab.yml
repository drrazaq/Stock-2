name: Research lab
# RESEARCH LAB (research-lab.mjs; the DAILY RESEARCHER's own lab, first build 25 Oct 2026). Each daily-researcher idea is pre-registered in
# research-core.mjs and data/strategy-library.json (ids RQ-*) before any run; each 5-year test runs ONCE (first complete verdict frozen in
# data/research-lab.json firstRun); a forward PAPER ledger records new signals from Monday 26 Oct 2026 (data/research-paper.jsonl,
# research-today.json, research-board.json; the TRY SMALL lane in scan.mjs reads 'research'). Idea 1: LAZY PRICES (10-K text change,
# official SEC EDGAR files). The 10-K collection is cached in research-cache and may take more than one run; no verdict until the
# pre-registered data rule passes. Idea 2 (26 Oct 2026): CASH TENDER OFFERS (RQ-TENDER-*; SEC daily index + Schedule TO-T filings, cached in
# research-cache/to). Idea 3 (27 Oct 2026): INFORMATION-SHOCK CONTINUATION (RQ-ISC-*; C-ISC1, Jiang and Zhu 2017): 8-K lists from
# data.sec.gov submissions, cached in research-cache/isc. Idea 4 (28 Oct 2026): ORDER BACKLOG GROWTH (RQ-RPO-*; RevenueRemainingPerformanceObligation from
# the SEC bulk company facts file, read once into research-cache/rpo.json.gz; paper via companyconcept). Idea 5 (31 Oct 2026): EARNINGS ANNOUNCEMENT
# TIMING (RQ-EAT-*; Johnson and So 2018): item-2.02 8-K dates vs the year-ago date, from the idea-3 8-K lists in research-cache/isc; paper via fresh submissions. Idea 6 (1 Nov 2026): TAX EXPENSE MOMENTUM
# (RQ-TAX-*; Thomas and Zhang 2011): quarterly IncomeTaxExpenseBenefit + Assets from the same SEC bulk company facts file, read once into
# research-cache/tax.json.gz; paper via companyconcept. Idea 7 (2 Nov 2026): R&D INCREASES (RQ-RDI-*; Eberhart, Maxwell and Siddique 2004):
# quarterly R&D + Assets from the same bulk file, read once into research-cache/rdi.json.gz; paper via companyconcept. Idea 8 (3 Nov 2026): INVENTORY CHANGES (RQ-INV-*;
# Thomas and Zhang 2002): InventoryNet + Assets instants from the same bulk file, read once into research-cache/inv.json.gz; paper via companyconcept. Idea 9 (4 Nov 2026): GOODWILL IMPAIRMENTS as an AVOID / SELL-warning check (RQ-GWI-*;
# Hirschey and Richardson 2003): GoodwillImpairmentLoss + Assets from the same bulk file, read once into research-cache/gwi.json.gz; no paper buy lane.
# Idea 12 (8 Nov 2026): DISTRESS RISK as an AVOID / SELL-warning check (RQ-DIST-*; Campbell, Hilscher and Szilagyi 2008): net income, liabilities,
# equity, cash from the same bulk file (research-cache/dst.json.gz) + prices + data/shares.json.gz; no paper buy lane.
# Idea 13 (9 Nov 2026): ORGANIZATION CAPITAL (RQ-OC-*; Eisfeldt and Papanikolaou 2013): annual SG&A (10-K) + Assets from the same bulk file,
# read once into research-cache/oc.json.gz; paper via companyconcept. Idea 14 (10 Nov 2026): WIKIPEDIA ATTENTION (RQ-WIKI-*; Pyun 2024, Da, Engelberg
# and Gao 2011): Wikidata CIK (P5531) -> English article map (research-cache/wiki-map.json) + Wikimedia Pageviews API daily user views
# (research-cache/wiki.json.gz, extended each run; also the paper lane). Idea 15 (11 Nov 2026): FINRA DAILY SHORT SALE VOLUME (RQ-SVOL-*; Wang, Yan and Zheng 2020):
# FINRA Reg SHO consolidated daily files (cdn.finra.org, official, free), liquid stocks only, research-cache/svol.json.gz (extended each run; also the paper lane). Idea 16 (12 Nov 2026): PRE-EARNINGS RUN-UP OF PAST WINNERS (RQ-PRE-*; Aboody, Lehavy and Trueman 2010): the idea-5 item-2.02 dates + 12-month returns from the price cache; no new reads, no paper lane yet. The price cache and Squad 1's cache (point-in-time ticker <-> CIK pairs) are RESTORED READ ONLY; only
# research-cache is saved. Commits only its own output files and its own library entries. Never places an order.
# Start by hand: change run-research-now.txt (or run the workflow).
on:
  schedule:
    - cron: '17 22 * * 1-5'   # weekday evenings after the close: paper lane (and data collection until complete)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-research-now.txt']
permissions:
  contents: write
concurrency: research-lab
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad1-cache
          key: squad1-cache-none
          restore-keys: squad1-cache-
      - uses: actions/cache/restore@v4
        with:
          path: research-cache
          key: research-cache-${{ github.run_id }}
          restore-keys: research-cache-
      - shell: bash .github/private-shell.sh pipefail {0}
        run: du -sh study-cache squad1-cache research-cache 2>/dev/null || true
      - shell: bash .github/private-shell.sh pipefail {0}
        timeout-minutes: 310
        run: |
          set -o pipefail
          node research-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          RQ_MINUTES: '290'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: research-cache
          key: research-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/research-run.log 2>/dev/null || true
          FILES="data/research-lab.json data/research-paper.jsonl data/research-today.json data/research-board.json data/research-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry of a FAILED run (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || { LF=1; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-copy "registry merge NOT stored (quarantine, not current)" "$RUNNER_TEMP/library-run.json" strategy-library.json || true; }
          else echo "- research registry: NOT published and NOT durable (not in private mode)" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "research lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the research lab result"; exit 1; }
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      # P0: no run-log/data artifact (public-repo artifacts are downloadable; step output is private)