name: Research lab
# RESEARCH LAB (research-lab.mjs; the DAILY RESEARCHER's own lab, first build 25 Oct 2026). Each daily-researcher idea is pre-registered in
# research-core.mjs and data/strategy-library.json (ids RQ-*) before any run; each 5-year test runs ONCE (first complete verdict frozen in
# data/research-lab.json firstRun); a forward PAPER ledger records new signals from Monday 26 Oct 2026 (data/research-paper.jsonl,
# research-today.json, research-board.json; the TRY SMALL lane in scan.mjs reads 'research'). Idea 1: LAZY PRICES (10-K text change,
# official SEC EDGAR files). The 10-K collection is cached in research-cache and may take more than one run; no verdict until the
# pre-registered data rule passes. Idea 2 (26 Oct 2026): CASH TENDER OFFERS (RQ-TENDER-*; SEC daily index + Schedule TO-T filings, cached in
# research-cache/to). Idea 3 (27 Oct 2026): INFORMATION-SHOCK CONTINUATION (RQ-ISC-*; C-ISC1, Jiang and Zhu 2017): 8-K lists from
# data.sec.gov submissions, cached in research-cache/isc. Idea 4 (28 Oct 2026): ORDER BACKLOG GROWTH (RQ-RPO-*; RevenueRemainingPerformanceObligation from
# the SEC bulk company facts file, read once into research-cache/rpo.json.gz; paper via companyconcept). The price cache and Squad 1's cache (point-in-time ticker <-> CIK pairs) are RESTORED READ ONLY; only
# research-cache is saved. Commits only its own output files and its own library entries. Never places an order.
# Start by hand: change run-research-now.txt (or run the workflow).
on:
  schedule:
    - cron: '17 22 * * 1-5'   # weekday evenings after the close: paper lane (and data collection until complete)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-research-now.txt']
permissions:
  contents: write
concurrency: research-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad1-cache
          key: squad1-cache-none
          restore-keys: squad1-cache-
      - uses: actions/cache/restore@v4
        with:
          path: research-cache
          key: research-cache-${{ github.run_id }}
          restore-keys: research-cache-
      - shell: bash
        run: du -sh study-cache squad1-cache research-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 310
        run: |
          set -o pipefail
          node research-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          RQ_MINUTES: '290'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: research-cache
          key: research-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/research-run.log 2>/dev/null || true
          FILES="data/research-lab.json data/research-paper.jsonl data/research-today.json data/research-board.json data/research-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "research lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the research lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-lab-log
          path: run.log
