name: Pre-market check
on:
  schedule:
    - cron: '40 12 * * 1-5'   # 08:40 EDT
    - cron: '40 13 * * 1-5'   # 08:40 EST
  push:
    branches: [main]
    paths: ['run-premarket-now.txt']   # Claude's 'run now' button
  workflow_dispatch:
permissions:
  contents: read
concurrency: premarket
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ignore wrong DST schedule
        id: season
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]] && { [[ "$SCHEDULE" == '40 12 * * 1-5' && "$offset" != '-0400' ]] || [[ "$SCHEDULE" == '40 13 * * 1-5' && "$offset" != '-0500' ]]; }; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.season.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      - if: steps.season.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.season.outputs.run == 'true'
        run: node premarket-check.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
