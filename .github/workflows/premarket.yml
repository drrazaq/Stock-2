name: Pre-market check
on:
  schedule:
    - cron: '40 12 * * 1-5'   # 8:40 New York in summer time (7:40 in winter): before the open, 3:40 pm Kuwait
  push:
    branches: [main]
    paths: ['run-premarket-now.txt']   # Claude's 'run now' button
  workflow_dispatch:
permissions:
  contents: read
concurrency: premarket
jobs:
  # schedule guard (17 Nov 2026): GitHub's cron here runs hours late. While the bot job's schedule guard is alive it starts this job
  # on time itself, so a cron-started copy is skipped (no late duplicate messages or after-close scans). Fails open.
  slot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            schedule-skip.mjs
            data/schedule-guard.json
          sparse-checkout-cone-mode: false
      - id: g
        run: node schedule-skip.mjs | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  check:
    needs: slot
    if: ${{ !cancelled() && needs.slot.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node premarket-check.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
