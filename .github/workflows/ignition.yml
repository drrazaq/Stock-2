name: Ignition watcher
on:
  schedule:
    # Season identity is checked explicitly; the opposite cron never observes.
    # Both scheduled and existing guard starts target09:10; early dispatches are refused.
    # The process observation budget begins after the09:25 wait. No new recovery dispatch.
    - cron: '10 13 * * 1-5'
    - cron: '10 14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ignition
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      IG_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - name: Required history (P0; private mode only; missing = UNKNOWN, never a fresh first run)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-data.sh require ignition-paper.jsonl radar-v3-ledger.jsonl opp-ledger.jsonl ignition-days.jsonl
      - name: Producer admission (P0; private mode only; needs this job's hydration receipt)
        if: hashFiles('.github/private-data-mode') != ''
        run: bash .github/private-outputs.sh admit
      - name: Watcher reservation custody (P0; private mode only; NOT ADMITTED keeps private reservations closed, never a public fallback)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node watcher-custody.mjs admit || [ $? = 3 ]
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check watcher admission
        id: admission
        run: node watcher-schedule.mjs
      - if: steps.admission.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: fm-cache
          key: fm-cache-none
          restore-keys: fm-cache-
      - name: Recheck watcher admission after cache
        if: steps.admission.outputs.run == 'true'
        id: ready
        run: node watcher-schedule.mjs
      # Checks the whole market every minute for stocks starting to run. Alerts only rules that passed the minute test.
      - name: Observe configured session
        if: steps.ready.outputs.run == 'true'
        shell: bash .github/private-shell.sh pipefail {0}
        run: |
          set -o pipefail
          node ignition-watch.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}   # (28 Oct) catalyst headlines for early-alert candidates only
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}   # P0: private reservation publication (private mode, custody-admitted only)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      # Durable per-stock ledger of today's 15%+ movers (the missed-runner autopsy reads it; no data calls).
      - if: always() && steps.ready.outputs.run == 'true'
        continue-on-error: true
        run: MR_LEDGER_ONLY=1 node missed-runners.mjs 2>&1 | tee -a run.log
      - if: always() && steps.ready.outputs.run == 'true'
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          PF=0; if [ "${{ job.status == 'success' }}" = true ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "live watcher (owner fail marks filter)" || PF=1; else PF=2; PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh retain-failed "live watcher (owner fail marks filter)" shadow/ ignition-runs/ ignition-live.json ignition-paper.jsonl premarket.jsonl ignition-days.jsonl vol-curve.json ignition-missed-history.jsonl early-wave-obs.jsonl radar-v3-ledger.jsonl radar-v3-snap.json opp-ledger.jsonl opp-days.jsonl || true; fi   # P0: a failed run is retained privately BEFORE any reset/clean   # P0 class B
          [ "$PF" != 1 ] || { echo "P0: owner-derived outputs NOT confirmed privately: stopping BEFORE any reset/clean (the failure step keeps them as quarantine)"; exit 1; }
          set -euo pipefail
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          true   # P0: shadow/ and ignition-runs/ are PRIVATE directories (saved above through the private route); nothing of the watcher is added publicly here
          git diff --cached --quiet || git commit -m "ignition $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: watcher publication unconfirmed"; exit 1; }
          [ "$PF" = 0 ] || exit 1   # P0: owner-derived outputs not stored privately (or a failed run): the job fails visibly
      - if: failure() && steps.ready.outputs.run == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true

      # P0: no watcher-evidence artifact. Artifacts of a public repository are downloadable, and this one carried owner-derived files
      # (the radar ledger and snapshot, the run archives, the message state). That evidence is kept through the private route instead.
      # P0: the producer FAILED after a successful private pull: its changed owner-derived outputs are kept as private quarantine
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-outputs.sh retain-failed "live watcher (owner fail marks filter)" shadow/ ignition-runs/ ignition-live.json ignition-paper.jsonl premarket.jsonl ignition-days.jsonl vol-curve.json ignition-missed-history.jsonl early-wave-obs.jsonl radar-v3-ledger.jsonl radar-v3-snap.json opp-ledger.jsonl opp-days.jsonl
