name: Agent C lab 2
# AGENT C (Crowd) one-shot lab 2 (agent-c2-lab.mjs; the 5 Nov 2026 run). Rules pre-registered in the agent-c2-core.mjs header before any run:
# C-CT1a / C-CT1b (8-K item 1.01 contract amount >= 10% of market cap; b also covers 4 quarters of cash burn) and C-INS3-20 / C-INS3-60
# (Cohen-Malloy-Pomorski opportunistic insider clusters). A push of run-agent-c2-now.txt runs it (last line DIAG = coverage only, no returns).
# Each rule is judged ONCE (first complete verdict frozen in data/agent-c2-lab.json firstRun). Then tip-score.mjs is run into its own file
# (data/agent-c-tip-score.json; the Sunday study's data/tip-score.json is not touched). No schedule, no Telegram, never an order.
# The price cache and the squad 21 / squad 4 / value-lab caches are RESTORED READ ONLY; only agentc2-cache is saved.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'lab | diag (empty = the last line of run-agent-c2-now.txt decides)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['run-agent-c2-now.txt']
permissions:
  contents: write
concurrency:
  group: agent-c2-lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad21-cache
          key: squad21-cache-none
          restore-keys: squad21-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: value-cache
          key: value-cache-none
          restore-keys: value-cache-
      - uses: actions/cache/restore@v4
        with:
          path: agentc2-cache
          key: agentc2-cache-${{ github.run_id }}
          restore-keys: agentc2-cache-
      - shell: bash
        run: du -sh study-cache squad21-cache squad4-cache value-cache agentc2-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 320
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if tail -n 1 run-agent-c2-now.txt | grep -q DIAG; then MODE=diag; else MODE=lab; fi
          fi
          echo "mode: $MODE"; export MODE
          node agent-c2-lab.mjs 2>&1 | tee run.log
          OUT=data/agent-c-tip-score.json node tip-score.mjs 2>&1 | tail -n 40 | tee -a run.log || true
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          AGC2_MINUTES: '300'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: agentc2-cache
          key: agentc2-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/agent-c2-run.log 2>/dev/null || true
          FILES="data/agent-c2-lab.json data/agent-c2-diag.json data/agent-c2-run.log data/agent-c-tip-score.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "agent C lab 2 $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the agent C lab 2 result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c2-lab-log
          path: run.log
