name: Stock scanner
on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '10,40 13-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: scanner
# P0 (Codex 6854715808): every run step's output is kept PRIVATE (.github/private-shell.sh); the public log shows only exit status
defaults:
  run:
    shell: bash .github/private-shell.sh plain {0}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Always start from the newest saved state. Without this a run that was queued behind another one starts from an
      # older copy and then overwrites what the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # P0 Route A (development, not installed): after the private-data cutover the owner's files come ONLY from the private repository.
      # private-data.sh pull fails closed (exit 1) when it cannot read them, so no job runs on missing holdings or marks.
      - name: Private owner files
        shell: bash .github/private-shell.sh pipefail {0}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_READ || secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -e .github/private-data-mode ]; then bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"; else echo "private data: not in private mode"; fi
      - name: Watcher reservation custody (P0; private mode only; NOT ADMITTED keeps private reservations closed, never a public fallback)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_READ || secrets.PRIVATE_DATA_TOKEN }}
        run: node watcher-custody.mjs admit || [ $? = 3 ]
      # The nightly scan runs as two isolated passes (scan-passes.mjs): only the public pass's output and stdout are public; the private
      # pass's output stays private (data/private-*, owner files, data/private-scan-stdout.log). The intraday checks keep the single pass.
      - shell: bash .github/private-shell.sh pipefail {0}
        run: |
          set -o pipefail
          if [ "$MODE" = daily ]; then node scan-passes.mjs 2>&1 | tee run.log; else node scan.mjs 2>&1 | tee run.log; fi
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          MODE: ${{ github.event.schedule == '10,40 13-20 * * 1-5' && 'intraday' || 'daily' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ZOYA_KEY: ${{ secrets.ZOYA_KEY }}
          HALALTERMINAL_KEY: ${{ secrets.HALALTERMINAL_KEY }}
          HALALSCREENER_KEY: ${{ secrets.HALALSCREENER_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          # P0 Route A: the private pass refreshes the owner's latest files from the private repository (owner-latest.sh); the public pass's
          # environment allowlist never receives it
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          RATE: ${{ vars.RATE || '8' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # P0 Route A (Codex 6851335617): a FAILED nightly may already have sent an owner-facing line (for example a SELL). The scan keeps the
      # failed private pass's evidence as private quarantine (data/private-failed-pass-*, never current state, never re-sent). Store it
      # through the private route only (nothing public is saved after a failure, as before), or say plainly that it was not stored.
      - if: failure()
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          ls data/private-failed-pass-*.json >/dev/null 2>&1 || { echo "failed scan: no failed private pass evidence to keep"; exit 0; }
          [ ! -e .github/private-data-mode ] || [ -e "$RUNNER_TEMP/private-pulled-ok" ] || { echo "Error: the private pull did not succeed in this job: nothing pushed (no stale owner files)"; exit 1; }
          if [ -e .github/private-data-mode ] && PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh push; then
            echo "failed scan: the failed private pass evidence was stored in the private repository (quarantine; not current state)"
          else
            echo "Error: the failed private pass evidence was NOT stored privately (private mode off or private save failed); it existed only on this runner and is lost when this job ends"; exit 1
          fi
      - env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          # review S-1 (22 Oct): on a conflict the owner's positions, trades and bot state keep origin's copy (the bot's), every other
          # file keeps this run's copy as before; see .github/save-data.sh and test/save-data.test.mjs
          set -o pipefail
          # P0 Route A: owner files are saved to the PRIVATE repository first; only a verified private save lets the public save report
          # success (PRIVATE_SAVE_OK=1). The public save never publishes owner files and fails visibly (exit 3) if they were not persisted.
          PRIVATE_SAVE_OK=
          if [ -e .github/private-data-mode ] && PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh push; then PRIVATE_SAVE_OK=1; fi
          PRIVATE_SAVE_OK=$PRIVATE_SAVE_OK bash .github/save-data.sh "scan $(date -u +%FT%RZ)" 2>&1 | tee -a run.log
      # privacy migration stage 1 (28 Oct): copy the owner's private files to the private repository (mirror only; production still
      # reads this repository). Does nothing without PRIVATE_DATA_TOKEN or before the connection check; never fails the scan.
      - continue-on-error: true
        if: ${{ hashFiles('.github/private-data-mode') == '' }}
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh mirror || true
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
