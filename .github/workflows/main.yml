name: Stock scanner
# (10 Nov, development proposal rev 2) a guard-started run carries its attempt key in its name, so the guard reconciles it exactly.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != '' && format('Stock scanner guard {0}', inputs.slot) || 'Stock scanner' }}
on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '10,40 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      # (10 Nov, development proposal) the bot loop's scanner guard (scanner-guard.mjs) starts a missed scheduled run with an explicit mode.
      # Empty mode keeps the old manual meaning: a forced daily scan.
      mode:
        type: string
        default: ''
        description: "daily or intraday (scanner guard); empty = forced daily scan"
      slot:
        type: string
        default: ''
        description: "scanner guard slot key, for the record"
permissions:
  contents: write
concurrency: scanner
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Always start from the newest saved state. Without this a run that was queued behind another one starts from an
      # older copy and then overwrites what the earlier run saved.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          # (rev 2, G4) admission before any data or send. Allowed: empty mode (legacy manual = forced daily), 'daily' or 'intraday'
          # without a slot (manual), or a guard slot that matches its mode exactly. Every other combination is refused.
          ok=0
          case "$MODE_INPUT:$GUARD_SLOT" in
            :|daily:|intraday:) ok=1 ;;
            daily:nightly:*|intraday:intraday:*) [[ "$GUARD_SLOT" =~ ^(nightly|intraday):[0-9]{4}-[0-9]{2}-[0-9]{2}:[0-9]+$ ]] && ok=1 ;;
          esac
          if [ "$ok" != 1 ]; then echo "scanner refused: invalid dispatch mode or slot"; exit 1; fi
          echo "scanner start: event=${{ github.event_name }} schedule='${{ github.event.schedule }}' MODE=$MODE FORCE=${FORCE:-0} slot=${GUARD_SLOT:-none} sha=$(git rev-parse HEAD)" | tee run.log
          node scan.mjs 2>&1 | tee -a run.log
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          MODE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'intraday')) && inputs.mode || (github.event.schedule == '10,40 13-20 * * 1-5' && 'intraday' || 'daily') }}
          # FORCE only for the legacy manual dispatch with an EMPTY mode; any other value is rejected below before any data or send.
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == '') && '1' || '' }}
          MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
          GUARD_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ZOYA_KEY: ${{ secrets.ZOYA_KEY }}
          HALALTERMINAL_KEY: ${{ secrets.HALALTERMINAL_KEY }}
          HALALSCREENER_KEY: ${{ secrets.HALALSCREENER_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RATE: ${{ vars.RATE || '8' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          # review S-1 (22 Oct): on a conflict the owner's positions, trades and bot state keep origin's copy (the bot's), every other
          # file keeps this run's copy as before; see .github/save-data.sh and test/save-data.test.mjs
          set -o pipefail
          bash .github/save-data.sh "scan $(date -u +%FT%RZ)" 2>&1 | tee -a run.log
      # privacy migration stage 1 (28 Oct): copy the owner's private files to the private repository (mirror only; production still
      # reads this repository). Does nothing without PRIVATE_DATA_TOKEN or before the connection check; never fails the scan.
      - continue-on-error: true
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh mirror || true
      # If anything above failed, tell the owner on Telegram straight away.
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|rejected|refused|cannot|limit|HTTP [45][0-9][0-9]" run.log 2>/dev/null | grep -vE "DeprecationWarning|rate limit pause" | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
