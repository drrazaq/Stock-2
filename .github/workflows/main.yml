name: Stock scanner
on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '10,40 14-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: scanner
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scan.mjs
        env:
          MODE: ${{ github.event.schedule == '10,40 14-20 * * 1-5' && 'intraday' || 'daily' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RATE: ${{ vars.RATE || '8' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%RZ)"
          git pull --rebase || true
          git push
