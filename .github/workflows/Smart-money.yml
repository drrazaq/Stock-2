name: Smart money and analysts
on:
  schedule:
    - cron: '20 11 * * 1-5'
    - cron: '30 9 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency: smart-money
jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          set -o pipefail
          node smart-money.mjs 2>&1 | tee run.log
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          STUDY: ${{ github.event.schedule == '30 9 * * 0' && '1' || '' }}
      # Agent C (22 Oct 2026): public dated calls for the tip scoreboard (ARK daily buys, official free API, no login) ->
      # data/tips-public.jsonl. Scored by tip-score.mjs; never a buy list.
      - if: always()
        shell: bash
        continue-on-error: true
        run: node tip-sources.mjs 2>&1 | tee -a run.log
      # Earnings history for the earnings-surprise study (Alpha Vantage 25 a day, FMP if the plan allows, Finnhub calendar).
      - shell: bash
        run: |
          set -o pipefail
          node earnings-study.mjs 2>&1 | tee -a run.log
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      # Company events from the SEC (8-K items, Schedule 13D, offerings) and FDA approvals for the event study. Official free APIs,
      # no keys. The 5-year event history is kept in the Actions cache (not in the public repository).
      - if: always()
        uses: actions/cache/restore@v4
        with:
          path: ev-cache
          key: events-cache-${{ github.run_id }}
          restore-keys: events-cache-
      - if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          node events-study.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ev-cache
          key: events-cache-${{ github.run_id }}
      - if: always()
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "smart money $(date -u +%FT%RZ)"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|missing|cannot|HTTP [45][0-9][0-9]" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
