name: Squad 31 who is buying
# WHO IS BUYING (squad31-buyers.mjs, rules pre-registered in insider-core.mjs on 17 Nov 2026): insiders buying their own company (SEC Form 4)
# and House members' reported stock buys, with the "why" (role, committees, last 20 days, latest news) and a 5-year test of copying them.
#   lab   = the 5-year test (Sunday after the hunter lab, a manual run, or a push of run-squad31-now.txt)
#   daily = 08:00 New York: yesterday's filings -> Telegram WHO IS BUYING
# The schedule guard (bot job) starts 'daily' on time; cron is the fallback. Never places an order; halal = owner's ZAD marks.
on:
  schedule:
    - cron: '0 13 * * 1-5'    # daily: 08:00 New York in winter
    - cron: '30 10 * * 0'     # lab: Sunday, after the hunter lab refreshed the price cache
  workflow_dispatch:
    inputs:
      mode:
        description: 'lab | daily'
        required: false
        default: 'lab'
        type: string
  push:
    branches: ['main', 'buyers-*']
    paths: ['run-squad31-now.txt']
permissions:
  contents: write
concurrency:
  group: squad31-buyers
  cancel-in-progress: false
jobs:
  slot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            schedule-skip.mjs
            data/schedule-guard.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          # Sunday's full test is not started by the guard, so its cron copy always runs
          if [ "${{ github.event.schedule }}" = '30 10 * * 0' ]; then echo "skip=" | tee -a "$GITHUB_OUTPUT"; else node schedule-skip.mjs | tee -a "$GITHUB_OUTPUT"; fi
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  lab:
    needs: slot
    if: ${{ !cancelled() && needs.slot.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get install -y -q poppler-utils >/dev/null   # pdftotext for the House reports
      - uses: actions/cache/restore@v4   # prices: the hunter lab's cache (read only)
        with:
          path: squad30-cache
          key: squad30-cache-none
          restore-keys: squad30-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad31-cache
          key: squad31-cache-${{ github.run_id }}
          restore-keys: squad31-cache-
      - shell: bash
        run: |
          set -o pipefail
          M="${{ inputs.mode }}"
          if [ -z "$M" ]; then case "${{ github.event.schedule }}" in '0 13 * * 1-5') M=daily;; *) M=lab;; esac; fi
          echo "mode $M"; MODE=$M node squad31-buyers.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: squad31-cache
          key: squad31-cache-${{ github.run_id }}
      - if: success()
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          for f in data/squad31-buyers.json data/buyers-today.json data/buyers-live.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 31 buyers $(date -u +%FT%RZ)"
          B="${{ github.event_name == 'push' && github.ref_name || 'main' }}"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs origin "$B" && git push origin "HEAD:$B"; then break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
      - if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          WHY=$(grep -iE "error|refused|cannot" run.log 2>/dev/null | tail -n 3 | cut -c1-240 || true)
          curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=RUN FAILED: ${{ github.workflow }}.${WHY:+ Last error lines: $WHY} Send this message to Claude." "https://api.telegram.org/bot$TG_TOKEN/sendMessage" || true
