name: Squad 5 lab
# SQUAD 5: "THE S&P 500 / SPUS IS ITSELF A TRADING RULE - COPY WHAT MAKES IT WIN" (squad5-lab.mjs; the owner's squad competition, 24 Oct
# 2026). Index-style baskets (the largest companies, equal vs cap weight, 12-1 momentum with an index buffer, quality + size, a 200-day
# market filter, new entrants to the 500 largest, a point-in-time Shariah proxy), pre-registered in squad5-core.mjs and
# data/strategy-library.json before any run; each one's 5-year test runs ONCE (first complete verdict frozen in data/squad5-lab.json
# firstRun), judged as a portfolio (turnover costs, CAGR, drawdown vs SPY / SPUS / the average stock) and per holding period. Forward PAPER
# ledger from Monday 26 Oct 2026 (data/squad5-paper.jsonl, squad5-today.json = the current members of each basket, squad5-board.json).
# The whole-market price cache and Squad 4's / Squad 10's SEC caches are RESTORED READ ONLY (never saved); only this lab's own cache (squad5-cache) is
# saved. Commits only its own output files and its own library entries. Never places an order. Start by hand: change run-squad5-now.txt
# (a last line containing DIAG = coverage check only, nothing judged or written) or run the workflow.
on:
  schedule:
    - cron: '47 15 * * 0'     # Sunday, after the Sunday studies
    - cron: '55 23 * * 1-5'   # weekday evenings after the close: current members + paper lane
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad5-now.txt']
permissions:
  contents: write
concurrency: squad5-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad10-cache
          key: squad10-cache-none
          restore-keys: squad10-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad5-cache
          key: squad5-cache-${{ github.run_id }}
          restore-keys: squad5-cache-
      - shell: bash
        timeout-minutes: 130
        run: |
          set -o pipefail
          if tail -n 1 run-squad5-now.txt | grep -q DIAG; then export DIAG=1; fi
          node squad5-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ5_MINUTES: '120'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad5-cache
          key: squad5-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad5-run.log 2>/dev/null || true
          FILES="data/squad5-lab.json data/squad5-paper.jsonl data/squad5-today.json data/squad5-board.json data/squad5-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 5 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 5 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad5-lab-log
          path: run.log
