# One-off check (owner upgraded Alpaca to Algo Trader Plus, 23 Oct 2026): which live feed do the keys get? Read-only, no message sent.
name: Alpaca feed check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { ALPACA_KEY: '${{ secrets.ALPACA_KEY }}', ALPACA_SECRET: '${{ secrets.ALPACA_SECRET }}' }
        run: |
          node --input-type=module -e "
          import { snapshots, feedUsed } from './alpaca-feed.mjs';
          const h = { headers: { 'APCA-API-KEY-ID': process.env.ALPACA_KEY, 'APCA-API-SECRET-KEY': process.env.ALPACA_SECRET } };
          const r = await fetch('https://data.alpaca.markets/v2/stocks/snapshots?feed=sip&symbols=SPY,BHVN', h); console.log('SIP request HTTP', r.status, r.ok ? '' : (await r.text()).slice(0, 200));
          const j = await snapshots('https://data.alpaca.markets', ['SPY', 'BHVN'], h);
          console.log('FEED USED:', feedUsed()); for (const [s, x] of Object.entries(j || {})) console.log(s, 'last', x.latestTrade && x.latestTrade.p, 'at', x.latestTrade && x.latestTrade.t, 'day volume', x.dailyBar && x.dailyBar.v);"
