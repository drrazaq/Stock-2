name: Squad 24 lab
# SQUAD 24 (squad24-lab.mjs; 27 Oct 2026): "a small company announces a deal with a giant". SQ24-MEGADEAL is pre-registered in
# squad24-core.mjs and data/strategy-library.json before any run. MODE (last line of run-squad24-now.txt): BUILD = mega-cap candidates per
# quarter (market values only) + the case studies (data/squad24-cases.json); RUN = the one-shot 5-year test (only with the frozen list whose
# SHA-256 is in the core header), first complete verdict frozen in data/squad24-lab.json firstRun; SIDE = reviewer addendum reporting and
# exploratory side tests (data/squad24-side.json; squad1-cache Form 4 purchases RESTORED READ ONLY); schedule = PAPER (forward lane).
# The price cache and Squad 4's Form 3/4/5 ticker map are RESTORED READ ONLY; only squad24-cache is saved. Never places an order.
on:
  schedule:
    - cron: '50 23 * * 1-5'   # weekday evenings after the close: paper lanes (cached data, only new days and filings are fetched)
  workflow_dispatch:
    inputs:
      mode:
        description: 'BUILD / RUN / PAPER; empty = the last line of run-squad24-now.txt decides'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['run-squad24-now.txt']
permissions:
  contents: write
concurrency: squad24-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Privacy pre-push hook (P0, fail-closed if the hook is missing)
        run: test -x .github/hooks/pre-push && git config core.hooksPath .github/hooks
      - name: Private owner files (P0; private mode only; fail-closed if they cannot be read)
        if: hashFiles('.github/private-data-mode') != ''
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: bash .github/private-data.sh pull && touch "$RUNNER_TEMP/private-pulled-ok"   # the marker gates every later private push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash .github/private-data.sh require strategy-library.json && cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"   # P0: a missing private registry is UNKNOWN, never a fresh one
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: squad4-cache
          key: squad4-cache-none
          restore-keys: squad4-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad1-cache
          key: squad1-cache-none
          restore-keys: squad1-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad24-cache
          key: squad24-cache-${{ github.run_id }}
          restore-keys: squad24-cache-
      - shell: bash
        run: du -sh study-cache squad4-cache squad24-cache 2>/dev/null || true
      - shell: bash
        timeout-minutes: 300
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then if [ "${{ github.event_name }}" = "schedule" ]; then MODE=PAPER; else MODE=$(tail -n 1 run-squad24-now.txt | tr -dc 'A-Za-z'); fi; fi
          export MODE; echo "mode $MODE"
          node squad24-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SQ24_MINUTES: '285'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad24-cache
          key: squad24-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad24-run.log 2>/dev/null || true
          FILES="data/squad24-lab.json data/squad24-paper.jsonl data/squad24-today.json data/squad24-board.json data/squad24-megacaps-build.json data/squad24-cases.json data/squad24-side.json data/squad24-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          # P0: the research registry is PRIVATE (canonical name): only this run's changes are merged onto the newest private registry
          LF=0; if [ "${{ success() }}" != true ]; then cp "$RUNNER_TEMP/library-run.json" "data/private-failed-pass-$(date -u +%Y-%m-%dT%H-%M-%S-000Z)__strategy-library.json" 2>/dev/null && { PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-outputs.sh save "registry of a FAILED run (quarantine, not current)" || true; }; LF=1; echo "producer failed: its registry edits are kept as private quarantine, not merged"
          elif [ -e .github/private-data-mode ]; then PRIVATE_DATA_TOKEN="$PRIVATE_DATA_TOKEN" bash .github/private-data.sh merge-library "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" || LF=1
          else echo "::warning::research registry: NOT published and NOT durable (not in private mode)"; fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 24 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 24 lab result"; exit 1; }
          [ "$LF" = 0 ] || exit 1   # P0: registry not stored privately (or a failed run): the job fails visibly
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad24-lab-log
          path: run.log
