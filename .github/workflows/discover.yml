name: Discovery engine
on:
  schedule:
    - cron: '0 3 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency: discovery
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node discover.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "discovery $(date -u +%FT%RZ)"
          git pull --rebase || true
          git push
