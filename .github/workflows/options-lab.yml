name: Options lab
# The OPTIONS LANE (options-lab.mjs, pre-registered 23 Oct 2026 as OPT-LH1 / OPT-CAT1 / OPT-FOLLOW1 / OPT-UOA1): long calls only,
# judged on real historical option prices (Alpaca daily option bars since Feb 2024; Alpha Vantage HISTORICAL_OPTIONS bid/ask when the
# key allows it). Weekly on Saturday and on demand. The whole-market price cache is RESTORED READ ONLY from the Sunday study; only this
# lab's own option-price cache (opt-cache) is saved. Commits only its own output file and its own library entries.
on:
  schedule:
    - cron: '0 12 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run (default) or probe'
        default: 'run'
permissions:
  contents: write
concurrency: options-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: opt-cache
          key: opt-cache-${{ github.run_id }}
          restore-keys: opt-cache-
      - shell: bash
        timeout-minutes: 280
        run: |
          set -o pipefail
          node options-lab.mjs 2>&1 | tee run.log
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: opt-cache
          key: opt-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES="data/options-lab.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "options lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the options lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: options-lab-log
          path: run.log
