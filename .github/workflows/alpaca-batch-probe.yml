name: Dated read-only Alpaca batch access probe
# Standing owner authorization: read-only provider access checks. Not Phase A.
on:
  push:
    branches: [Stock2-safety-fixes]
    paths: [docs/validation/alpaca-batch-probe-2026-10-29.request.json]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'drrazaq/Stock-2' && github.ref_name == 'Stock2-safety-fixes' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/alpaca-batch-access-probe.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpaca-batch-probe-${{ github.sha }}
          path: probe-output/alpaca-batch-probe.json
          retention-days: 3
          if-no-files-found: error
