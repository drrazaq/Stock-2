name: One-session read-only Alpaca access audit
# Explicitly requested bounded diagnostic, not Phase A. Remove push trigger after this dated audit.
on:
  push:
    branches: [Stock2-safety-fixes]
    paths: [docs/validation/alpaca-access-2026-10-29.request.json]
permissions:
  contents: read
concurrency:
  group: alpaca-access-audit-2026-10-29
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'drrazaq/Stock-2' && github.ref_name == 'Stock2-safety-fixes' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bounded GET-only feed and asset observations
        run: node tools/alpaca-access-audit.mjs
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: alpaca-access-${{ github.sha }}
          path: probe-output/alpaca-access-audit.json
          retention-days: 3
          if-no-files-found: error
