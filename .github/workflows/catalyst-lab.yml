name: Catalyst run-up lab
# The CATALYST RUN-UP lab on its own (catalyst-lab.mjs; pre-registered 23 Oct 2026 as CAT-RUN1 / CAT-NEWS1), so it can run now without
# re-running every Sunday study. The same step also runs every Sunday inside leaders-study.yml. The whole-market price cache is
# RESTORED READ ONLY from the Sunday job (never saved here); only this lab's own EDGAR cache (cat-cache) is saved. Commits only its
# own output files and its own library entries.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalyst-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: cat-cache
          key: cat-cache-${{ github.run_id }}
          restore-keys: cat-cache-
      - shell: bash
        timeout-minutes: 75
        run: |
          set -o pipefail
          node catalyst-lab.mjs 2>&1 | tee run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: cat-cache
          key: cat-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES="data/catalyst-lab.json data/catalyst-today.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "catalyst lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the catalyst lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-lab-log
          path: run.log
