name: R1 sealed provider data migration (one-off, owner approval only)
# R1 (review only; NOT run). Converts the tracked plaintext T1 provider-data files of ONE approved source commit to sealed files in ONE
# verified commit: clean checkout of exactly that commit; seal + read-back; plaintext deletions staged with their sealed replacements;
# a manifest (.github/r1-migration-manifest.json: every source path, size, sha256) committed with them; the index verified (no T1
# plaintext, the exact manifest set, every sealed file decrypts to its source hash). The push is FAST-FORWARD ONLY onto that same
# commit (no rebase onto newer data, no retry): if main moved, nothing is published and the run fails. The pushed tree is then verified
# again (complete set, parent = the approved source). Runs only by hand, with the exact confirmation text, inside an approved window
# after the writer quiescence gate (r1-writer-gate.mjs) has passed. Git HISTORY is not changed: earlier commits keep their plaintext.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE-R1 to seal the T1 files (owner-approved maintenance only)'
        required: true
      source_sha:
        description: 'The approved source commit (full 40-character id of main at the start of the window)'
        required: true
      mode:
        description: 'backup-compare (compare the R1_BACKUP_CHECK secret with the production secret; PASS/FAIL only), key-check (print a check vector only) or migrate'
        required: true
        default: key-check
permissions:
  contents: write
concurrency: r1-migrate
jobs:
  key-check:
    # R1 rev5: before any migration, prove the owner's off-GitHub backup is the production secret (RELEASE.md gate G3b). Prints only a
    # sealed random value and its hash (no data, no key); the owner verifies it locally with sealed-migrate.mjs --key-check.
    if: github.event.inputs.confirm == 'MIGRATE-R1' && github.event.inputs.mode == 'key-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        env:
          SEALED_SECRET: ${{ secrets.PRIVATE_KEY }}
        run: node sealed-migrate.mjs --key-check-make
  backup-compare:
    # R1 rev6 (RELEASE.md B5b, route a): the owner adds a TEMPORARY secret R1_BACKUP_CHECK pasted from the off-GitHub backup, runs this,
    # then deletes the secret. Compares derived keys in constant time; prints PASS/FAIL only. Changes nothing.
    if: github.event.inputs.confirm == 'MIGRATE-R1' && github.event.inputs.mode == 'backup-compare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        env:
          SEALED_SECRET: ${{ secrets.PRIVATE_KEY }}
          BACKUP_SECRET: ${{ secrets.R1_BACKUP_CHECK }}
        run: node sealed-migrate.mjs --backup-compare
  migrate:
    if: github.event.inputs.confirm == 'MIGRATE-R1' && github.event.inputs.mode == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        env:
          SEALED_SECRET: ${{ secrets.PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          source .github/sealed-git.sh
          git fetch -q origin main
          [ "$(git rev-parse origin/main)" = "$SOURCE_SHA" ] || { echo "Error: main is no longer the approved source; nothing migrated"; exit 1; }
          node sealed-migrate.mjs --plan | tail -n 1
          node sealed-migrate.mjs --apply "$SOURCE_SHA"
          node sealed-guard.mjs --all
          git commit -q -m "R1: seal T1 provider data (plaintext removed from the tip; history unchanged)"
          node sealed-migrate.mjs --verify-tree HEAD
          git push -q origin HEAD:refs/heads/main   # fast-forward only; refused if main moved
          git fetch -q origin main
          node sealed-migrate.mjs --verify-tree origin/main
