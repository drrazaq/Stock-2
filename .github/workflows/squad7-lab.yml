name: Squad 7 lab
# SQUAD 7: WINNER DNA (squad7-lab.mjs; the owner's squads 5-8 of 24 Oct 2026). Stage 1 (last line of run-squad7-now.txt contains DNA):
# matched case-control discovery of what big winners showed BEFORE they moved, on the OLDER half only -> data/squad7-dna.json (run once).
# Stage 2 (any other push of the trigger, or the weekday schedule): the SQ7-* rules registered in squad7-core.mjs after stage 1 get their
# ONE 5-year test (first complete verdict frozen in data/squad7-lab.json firstRun), then the forward PAPER lane from Monday 26 Oct 2026
# (data/squad7-paper.jsonl, squad7-today.json, squad7-board.json). The whole-market price cache and the anomaly lab's / Agent A's Nasdaq
# calendar caches are RESTORED READ ONLY; only this lab's own cache (squad7-cache) is saved. Commits only its own output files and its own
# library entries. Never places an order. A last line containing DIAG = coverage check only.
on:
  schedule:
    - cron: '05 0 * * 2-6'    # weekday evenings after the close (UTC next day): paper lane
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-squad7-now.txt']
permissions:
  contents: write
concurrency: squad7-lab
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_OPTIONS: --max-old-space-size=13000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: a-cache
          key: a-cache-none
          restore-keys: a-cache-
      - uses: actions/cache/restore@v4
        with:
          path: anomaly-cache
          key: anomaly-cache-none
          restore-keys: anomaly-cache-
      - uses: actions/cache/restore@v4
        with:
          path: squad7-cache
          key: squad7-cache-${{ github.run_id }}
          restore-keys: squad7-cache-
      - shell: bash
        timeout-minutes: 300
        run: |
          set -o pipefail
          L="$(tail -n 1 run-squad7-now.txt)"
          if [ "${{ github.event_name }}" = "push" ] && echo "$L" | grep -q DNA; then export SQ7_MODE=dna; fi
          if [ "${{ github.event_name }}" = "push" ] && echo "$L" | grep -q SCREEN; then export SQ7_MODE=screen; fi
          if echo "$L" | grep -q DIAG; then export DIAG=1; fi
          node squad7-lab.mjs 2>&1 | tee run.log
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY }}
          SQ7_MINUTES: '290'
      - if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: squad7-cache
          key: squad7-cache-${{ github.run_id }}
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          tail -n 300 run.log | cut -c1-2000 > data/squad7-run.log 2>/dev/null || true
          FILES="data/squad7-dna.json data/squad7-screen.json data/squad7-lab.json data/squad7-paper.jsonl data/squad7-today.json data/squad7-board.json data/squad7-diag.json data/squad7-run.log"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "squad 7 lab $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the squad 7 lab result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: squad7-lab-log
          path: run.log
