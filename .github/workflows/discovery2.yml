name: Discovery engine v2
# DISCOVERY ENGINE v2 on its own (discovery2.mjs; owner, 23 Oct 2026: "come up with new paths by itself"), so it can run now without
# re-running every Sunday study. The same step also runs every Sunday inside leaders-study.yml. Every cache is RESTORED READ ONLY from the
# Sunday jobs (whole-market prices + insider, fund and EDGAR-index caches in study-cache, SEC events in ev-cache, the dilution index in
# cat-cache); nothing is saved back. Commits only its own output files and its own library entries.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-discovery2-now.txt']   # Claude's 'run now' button: changing this file starts the engine at once
permissions:
  contents: write
concurrency: discovery2
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: ev-cache
          key: events-cache-none
          restore-keys: events-cache-
      - uses: actions/cache/restore@v4
        with:
          path: cat-cache
          key: cat-cache-none
          restore-keys: cat-cache-
      - shell: bash
        timeout-minutes: 100
        run: |
          set -o pipefail
          ls -la study-cache ev-cache cat-cache 2>&1 | head -40 | tee run.log
          node discovery2.mjs 2>&1 | tee -a run.log
        env:
          SEC_UA: ${{ secrets.SEC_UA || format('{0} {0}@users.noreply.github.com', github.repository_owner) }}
      - if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES="data/discovery2.json data/discovery2-today.json"
          # Preserve this run before any pull. Never reset/clean computed output
          # or select a conflicting frozen result automatically.
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES data/strategy-library.json; do
            if [ -f "$f" ]; then cp "$f" "$OUTD/$f"; git add -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "discovery2 result $(date -u +%F)"
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$ok" = 1 ] || { echo 'Error: result publication unconfirmed; retain run-out artifact and both commits for review'; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: discovery2-log
          path: |
            run.log
            ${{ runner.temp }}/run-out/
