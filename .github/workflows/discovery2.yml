name: Discovery engine v2
# DISCOVERY ENGINE v2 on its own (discovery2.mjs; owner, 23 Oct 2026: "come up with new paths by itself"), so it can run now without
# re-running every Sunday study. The same step also runs every Sunday inside leaders-study.yml. Every cache is RESTORED READ ONLY from the
# Sunday jobs (whole-market prices + insider, fund and EDGAR-index caches in study-cache, SEC events in ev-cache, the dilution index in
# cat-cache); nothing is saved back. Commits only its own output files and its own library entries.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['run-discovery2-now.txt']   # Claude's 'run now' button: changing this file starts the engine at once
permissions:
  contents: write
concurrency: discovery2
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cp data/strategy-library.json "$RUNNER_TEMP/library-base.json"
      - uses: actions/cache/restore@v4
        with:
          path: study-cache
          key: leaders-study-none
          restore-keys: leaders-study-
      - uses: actions/cache/restore@v4
        with:
          path: ev-cache
          key: events-cache-none
          restore-keys: events-cache-
      - uses: actions/cache/restore@v4
        with:
          path: cat-cache
          key: cat-cache-none
          restore-keys: cat-cache-
      - shell: bash
        timeout-minutes: 100
        run: |
          set -o pipefail
          ls -la study-cache ev-cache cat-cache 2>&1 | head -40 | tee run.log
          node discovery2.mjs 2>&1 | tee -a run.log
      - if: success() || failure()
        shell: bash
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          FILES="data/discovery2.json data/discovery2-today.json"
          OUTD="$RUNNER_TEMP/run-out"; mkdir -p "$OUTD/data"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUTD/$f"; done; true
          cp data/strategy-library.json "$RUNNER_TEMP/library-run.json"
          git reset -q --hard && git clean -fdq data && git pull -q --rebase
          (cd "$OUTD" && find data -type f) | while read -r f; do cp "$OUTD/$f" "$f"; done
          node library-merge.mjs "$RUNNER_TEMP/library-base.json" "$RUNNER_TEMP/library-run.json" data/strategy-library.json || echo "Error: library merge failed"
          for f in $FILES data/strategy-library.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "discovery engine v2 $(date -u +%F)"
          ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
          [ "$ok" = 1 ] || { echo "Error: could not save the discovery engine result"; exit 1; }
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery2-log
          path: run.log
